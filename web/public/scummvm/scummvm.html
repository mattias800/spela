<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Spela ScummVM</title>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      html,
      body {
        width: 100%;
        height: 100%;
        overflow: hidden;
        background: #16191d;
        color: #e6e6e6;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui,
          sans-serif;
      }
      #canvas {
        display: block;
        width: 100%;
        height: 100%;
        background: #000;
      }
      #status {
        position: absolute;
        top: 50%;
        left: 50%;
        transform: translate(-50%, -50%);
        text-align: center;
        font-size: 14px;
        line-height: 1.5;
        opacity: 0.85;
        pointer-events: none;
      }
      #status.hidden {
        display: none;
      }
      .progress {
        margin-top: 12px;
        width: 240px;
        height: 6px;
        background: rgba(255, 255, 255, 0.12);
        border-radius: 3px;
        overflow: hidden;
      }
      .progress-fill {
        height: 100%;
        width: 0;
        background: #6366f1;
        transition: width 0.25s ease;
      }
    </style>
  </head>
  <body>
    <canvas id="canvas" oncontextmenu="event.preventDefault()" tabindex="-1"></canvas>
    <div id="status">
      <div id="status-text">Waiting for emulator init…</div>
      <div class="progress"><div id="progress-fill" class="progress-fill"></div></div>
    </div>

    <!--
      Spela ScummVM iframe shell — wraps chkuendig's WASM build with
      the parent ↔ iframe postMessage protocol used by the rest of
      the play page (see web/src/lib/emulator-protocol.ts). This file
      replaces upstream's `custom_shell.html` from chkuendig/scummvm
      so we control:
        - parent message handling (init / pause / resume / save-state)
        - tar-on-demand mounting of game data into MEMFS
        - data/ engine assets served from chkuendig's CDN (vendor-light)
        - lifecycle events back to the parent

      See #794 for the umbrella issue + carve-out from CLAUDE.md
      rule #4 (libretro only).
    -->
    <script src="./shell.js"></script>
  </body>
</html>
