<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 108 108" width="512" height="512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#A855F7"/>
      <stop offset="100%" stop-color="#3B82F6"/>
    </linearGradient>
    <radialGradient id="shine" cx="0.35" cy="0.35" r="0.65">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Gradient circle background -->
  <circle cx="54" cy="54" r="54" fill="url(#bg)"/>

  <!-- Subtle radial highlight for depth -->
  <circle cx="54" cy="54" r="54" fill="url(#shine)"/>

  <!-- White controller (stroke-based line art) -->
  <g fill="none" stroke="#FFFFFF" stroke-width="3" stroke-linecap="round" stroke-linejoin="round">
    <!-- Controller body with slight grip bumps -->
    <path d="M 39,39 H 69 Q 81,39 81,51 L 81,59 Q 81,66 74,66 Q 74,70 71,70 Q 68,70 68,66 Q 54,61 40,66 Q 40,70 37,70 Q 34,70 34,66 Q 27,66 27,59 L 27,51 Q 27,39 39,39 Z"/>

    <!-- Analog stick (left) -->
    <circle cx="40" cy="53" r="6"/>

    <!-- Action button (right, upper) -->
    <circle cx="68" cy="48" r="3"/>

    <!-- Action button (right, lower) -->
    <circle cx="68" cy="57" r="3"/>
  </g>
</svg>
