app-id: com.spela.player
runtime: org.freedesktop.Platform
runtime-version: '24.08'
sdk: org.freedesktop.Sdk
sdk-extensions:
  - org.freedesktop.Sdk.Extension.openjdk17
command: spela

finish-args:
  - --device=dri            # Vulkan GPU access
  - --socket=wayland        # Wayland display
  - --socket=x11            # X11/XWayland fallback (JDK AWT needs this)
  - --socket=pulseaudio     # Audio output
  - --share=network         # Connect to Spela server
  - --device=all            # Gamepad access (/dev/input)

modules:
  - name: SDL2
    buildsystem: cmake-ninja
    builddir: true
    config-opts:
      - -DSDL_STATIC=OFF
      - -DSDL_TEST=OFF
    sources:
      - type: archive
        url: https://github.com/libsdl-org/SDL/releases/download/release-2.30.10/SDL2-2.30.10.tar.gz
        sha256: f59adf36a0fcf4c94198e7d3d776c1b3824211ab7aeebeb31fe19836661196aa

  - name: spela
    buildsystem: simple
    build-commands:
      - install -d /app/bin /app/lib /app/share/applications /app/share/metainfo
        /app/share/icons/hicolor/256x256/apps
      - cp -r distributable/* /app/
      - install -m644 com.spela.player.desktop /app/share/applications/
      - install -m644 com.spela.player.metainfo.xml /app/share/metainfo/
      - install -m644 spela-icon.svg /app/share/icons/hicolor/256x256/apps/com.spela.player.svg
      - |
        cat > /app/bin/spela << 'EOF'
        #!/bin/sh
        export PATH="/app/jre/bin:$PATH"
        exec /app/bin/Spela "$@"
        EOF
      - chmod +x /app/bin/spela
    sources:
      - type: dir
        path: ../../desktop/build/compose/binaries/main/app/Spela
        dest: distributable
      - type: file
        path: ../com.spela.player.desktop
      - type: file
        path: ../com.spela.player.metainfo.xml
      - type: file
        path: ../../../web/public/spela-icon.svg
