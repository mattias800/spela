appId: com.spela.player
---

# Test: Exit game with auto-save, then resume with auto-load
#
# Verifies the full exit/resume cycle: play a game, exit (which triggers
# auto-save), return to the game detail screen, then play again (which
# should auto-load the saved state).

# ── Setup: login as player ──

- runFlow: setup/start-logged-in.yaml

# ── Navigate to NES > Castlevania ──

- scrollUntilVisible:
    element:
      text: ".*Nintendo Entertainment System.*"
    direction: DOWN

- tapOn:
    text: ".*Nintendo Entertainment System.*"

- scrollUntilVisible:
    element:
      text: ".*Castlevania.*"
    direction: DOWN

- tapOn:
    text: ".*Castlevania.*"

- extendedWaitUntil:
    visible:
      text: "About"
    timeout: 3000

# ── Download the game ──

# Download the game if not already downloaded
- runFlow:
    when:
      visible: "Download"
    file: setup/download-game.yaml

- tapOn: "Play"

# ── Wait for game to render ──

- extendedWaitUntil:
    visible:
      text: "Touch controls"
    timeout: 5000

# Open overlay using back button
- pressKey: "back"

- extendedWaitUntil:
    visible:
      text: "Exit Game"
    timeout: 5000

# ── Exit the game (triggers auto-save) ──

- tapOn: "Exit Game"

# ── Verify we return to game detail screen ──

- extendedWaitUntil:
    visible:
      text: "About"
    timeout: 8000

# The Play button should be visible again (game is cached)
- extendedWaitUntil:
    visible:
      text: "Play"
    timeout: 3000

# ── Second play session (should auto-load) ──

- tapOn: "Play"

# ── Wait for game to render ──

- extendedWaitUntil:
    visible:
      text: "Touch controls"
    timeout: 5000

# ── Open overlay via back button ──

- pressKey: "back"

- extendedWaitUntil:
    visible:
      text: "Exit Game"
    timeout: 5000

# Verify the overlay is functional
- assertVisible: "Continue"
- assertVisible: "Save"

# ── Clean up ──

- tapOn: "Exit Game"
