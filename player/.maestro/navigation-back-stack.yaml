appId: com.spela.player
---

# Test: Back navigation correctly pops the screen stack
#
# Regression test for bug where back gestures/buttons navigated forward
# instead of popping the navigation stack. This test navigates forward
# through three screens (Home -> Console -> Game Detail), then verifies
# that each back press returns to the PREVIOUS screen, not forward.

# ── Setup: login as player ──

- runFlow: setup/start-logged-in.yaml

# ── Navigate forward to Screen 2: NES console game list ──

- scrollUntilVisible:
    element:
      text: ".*Nintendo Entertainment System.*"
    direction: DOWN

- tapOn:
    text: ".*Nintendo Entertainment System.*"

# Verify we're on the console game list — wait for a game to appear
- extendedWaitUntil:
    visible:
      text: ".*Castlevania.*"
    timeout: 8000

# ── Navigate forward to Screen 3: Game detail ──

- tapOn:
    text: ".*Castlevania.*"

# Verify we're on the game detail screen
- extendedWaitUntil:
    visible:
      text: "Download|Play"
    timeout: 5000

# ── BACK #1: Game Detail -> Console game list ──
# This is the critical assertion. If back navigation is broken,
# pressing back here would NOT return to the console game list.

- pressKey: "back"

# Verify we're back on the NES console game list:
# Castlevania should still be visible (game list), but Download/Play should not
- extendedWaitUntil:
    visible:
      text: ".*Castlevania.*"
    timeout: 5000

# The game detail's "Download"/"Play" button should NOT be visible
- extendedWaitUntil:
    notVisible:
      text: "Download|Play"
    timeout: 3000

# ── BACK #2: Console game list -> Home screen ──

- pressKey: "back"

# Verify we're back on the Home screen (scroll up since position may be preserved)
- scrollUntilVisible:
    element:
      text: "Consoles"
    direction: UP
    timeout: 5000
