appId: com.spela.player
---

# Test: Back navigation correctly pops the screen stack
#
# Regression test for bug where back gestures/buttons navigated forward
# instead of popping the navigation stack. This test navigates forward
# through three screens (Home -> Console -> Game Detail), then verifies
# that each back press returns to the PREVIOUS screen, not forward.

# ── Setup: fresh start ──

- clearState:
    appId: "com.spela.player"
- launchApp:
    appId: "com.spela.player"

# ── Add server ──

- extendedWaitUntil:
    visible:
      text: "Connect to your game server"
    timeout: 15000

- tapOn: "Add Server"

- extendedWaitUntil:
    visible:
      text: "Server Name"
    timeout: 5000

- tapOn: "Server Name"
- inputText: "Local"

- tapOn: "Server URL"
- inputText: "http://192.168.11.143:8080"

- tapOn: "Add"
- tapOn: "Local"

# ── Login as player ──

- extendedWaitUntil:
    visible:
      text: "Welcome Back"
    timeout: 10000

- tapOn: "Username"
- inputText: "player"

- tapOn: "Password"
- inputText: "player123"

- hideKeyboard
- tapOn: "Sign In"

# ── Screen 1: Home screen ──

- extendedWaitUntil:
    visible:
      text: "Consoles"
    timeout: 15000

# ── Navigate forward to Screen 2: NES console game list ──

- scrollUntilVisible:
    element:
      text: ".*Nintendo Entertainment System.*"
    direction: DOWN

- tapOn:
    text: ".*Nintendo Entertainment System.*"

# Verify we're on the console game list (TopBar shows console name)
- extendedWaitUntil:
    visible:
      text: ".*Nintendo Entertainment System.*"
    timeout: 5000

# The console screen has a search field unique to this screen
- assertVisible:
    text: ".*Search.*games.*"

# ── Navigate forward to Screen 3: Game detail ──

- scrollUntilVisible:
    element:
      text: ".*Castlevania.*"
    direction: DOWN

- tapOn:
    text: ".*Castlevania.*"

# Verify we're on the game detail screen
- extendedWaitUntil:
    visible:
      text: "Download"
    timeout: 5000

# ── BACK #1: Game Detail -> Console game list ──
# This is the critical assertion. If back navigation is broken,
# pressing back here would NOT return to the console game list.

- pressKey: "back"

# Verify we're back on the NES console game list
- extendedWaitUntil:
    visible:
      text: ".*Search.*games.*"
    timeout: 5000

# The game detail's "Download" button should NOT be visible
- extendedWaitUntil:
    notVisible:
      text: "Download"
    timeout: 3000

# ── BACK #2: Console game list -> Home screen ──

- pressKey: "back"

# Verify we're back on the Home screen
- extendedWaitUntil:
    visible:
      text: "Consoles"
    timeout: 5000

# The search field from the console screen should NOT be visible
- extendedWaitUntil:
    notVisible:
      text: ".*Search.*games.*"
    timeout: 3000
