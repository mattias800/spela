appId: com.spela.player
---

# Test: Back navigation correctly pops the screen stack
#
# Regression test for bug where back gestures/buttons navigated forward
# instead of popping the navigation stack. This test navigates forward
# through three screens (Home -> Console -> Game Detail), then verifies
# that each back press returns to the PREVIOUS screen, not forward.

# ── Setup: login as player ──

- runFlow: setup/start-logged-in.yaml

# ── Navigate forward to Screen 2: NES console game list ──

- scrollUntilVisible:
    element:
      text: ".*Nintendo Entertainment System.*"
    direction: DOWN

- tapOn:
    text: ".*Nintendo Entertainment System.*"

# Verify we're on the console game list (SpTopBar shows "Go back" button)
# The "Go back" button only exists on sub-screens, NOT on the Home screen.
- extendedWaitUntil:
    visible:
      text: "Go back"
    timeout: 3000

# ── Navigate forward to Screen 3: Game detail ──

- scrollUntilVisible:
    element:
      text: ".*Castlevania.*"
    direction: DOWN

- tapOn:
    text: ".*Castlevania.*"

# Verify we're on the game detail screen
- extendedWaitUntil:
    visible:
      text: "Download"
    timeout: 3000

# ── BACK #1: Game Detail -> Console game list ──
# This is the critical assertion. If back navigation is broken,
# pressing back here would NOT return to the console game list.

- pressKey: "back"

# Verify we're back on the NES console game list:
# "Go back" is still visible (we're on a sub-screen, not Home)
- extendedWaitUntil:
    visible:
      text: "Go back"
    timeout: 3000

# The game detail's "Download" button should NOT be visible
- extendedWaitUntil:
    notVisible:
      text: "Download"
    timeout: 3000

# ── BACK #2: Console game list -> Home screen ──

- pressKey: "back"

# Verify we're back on the Home screen
- extendedWaitUntil:
    visible:
      text: "Consoles"
    timeout: 3000

# The "Go back" button should NOT be visible (Home has no back button)
- extendedWaitUntil:
    notVisible:
      text: "Go back"
    timeout: 3000
