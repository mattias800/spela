appId: com.spela.player
---

# Test: Auto-scrape game metadata on game detail screen
#
# When navigating to a game that has never been scraped, the app should
# automatically trigger a scrape and display the fetched metadata
# (cover art, description) without user intervention.

# ── Setup: fresh start ──

- clearState:
    appId: "com.spela.player"
- launchApp:
    appId: "com.spela.player"

# ── Add server ──

- extendedWaitUntil:
    visible:
      text: "Connect to your game server"
    timeout: 15000

- tapOn: "Add Server"

- extendedWaitUntil:
    visible:
      text: "Server Name"
    timeout: 5000

- tapOn: "Server Name"
- inputText: "Local"

- tapOn: "Server URL"
- inputText: "http://192.168.11.143:8080"

- tapOn: "Add"
- tapOn: "Local"

# ── Login as player ──

- extendedWaitUntil:
    visible:
      text: "Welcome Back"
    timeout: 10000

- tapOn: "Username"
- inputText: "player"

- tapOn: "Password"
- inputText: "player123"

- hideKeyboard
- tapOn: "Sign In"

# ── Home screen ──

- extendedWaitUntil:
    visible:
      text: "Consoles"
    timeout: 15000

# ── Navigate to NES console ──

- scrollUntilVisible:
    element:
      text: ".*Nintendo Entertainment System.*"
    direction: DOWN

- tapOn:
    text: ".*Nintendo Entertainment System.*"

# ── Find and tap a game (Castlevania) ──

- scrollUntilVisible:
    element:
      text: ".*Castlevania.*"
    direction: DOWN

- tapOn:
    text: ".*Castlevania.*"

# ── Wait for game detail screen to load ──
# "Download" button is always visible on game detail, regardless of scrape state.

- extendedWaitUntil:
    visible:
      text: "Download"
    timeout: 5000

# ── Assert that metadata appears after auto-scrape ──
# The "About" heading only renders when game.description is non-null, which
# means the scrape completed and populated metadata. We use a generous timeout
# since scraping involves a server-side network request to LibRetro/ScreenScraper,
# plus the 3-second delay in scrapeAndRefresh() before the UI refreshes.

- extendedWaitUntil:
    visible:
      text: "About"
    timeout: 30000

# ── Verify the game detail screen is fully populated ──

- assertVisible: "Download"
