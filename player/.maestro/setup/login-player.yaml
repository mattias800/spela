appId: com.spela.player
---

# Setup flow: Clear state, add server, and login as player.
# Used as initFlow before player test suites.

- clearState:
    appId: "com.spela.player"
- stopApp:
    appId: "com.spela.player"
- launchApp:
    appId: "com.spela.player"

# ── Add server ──

- extendedWaitUntil:
    visible:
      text: "Connect to your game server"
    timeout: 15000

- tapOn: "Add Server"

- tapOn: "Server Name"
- inputText: "Local"

- tapOn: "Server URL"
- inputText: "http://192.168.11.143:8080"

- tapOn: "Add"

# Tap the server card to connect
- tapOn: "Local"

# ── Login as player ──

- extendedWaitUntil:
    visible:
      text: "Welcome Back"
    timeout: 10000

- tapOn: "Username"
- inputText: "player"

- tapOn: "Password"
- inputText: "player123"

- hideKeyboard
- tapOn: "Sign In"

# ── Verify we reach the home screen ──

- extendedWaitUntil:
    visible:
      text: "Consoles"
    timeout: 15000
