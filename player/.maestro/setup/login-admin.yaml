appId: com.spela.player
---

# Setup flow: Clear state, add server, and login as admin.
# Used via runFlow before admin test suites.

- clearState:
    appId: "com.spela.player"
- stopApp:
    appId: "com.spela.player"
- launchApp:
    appId: "com.spela.player"

# ── Add server ──

- extendedWaitUntil:
    visible:
      text: "Connect to your game server"
    timeout: 8000

- tapOn: "Add Server"

- tapOn: "Server Name"
- inputText: "Local"
- hideKeyboard

- scrollUntilVisible:
    element:
      text: "Server URL"
    direction: DOWN
    timeout: 3000

- tapOn: "Server URL"
- inputText: "http://10.0.2.2:8080"
- hideKeyboard

- scrollUntilVisible:
    element:
      text: "Add"
    direction: DOWN
    timeout: 3000

- tapOn: "Add"

# Tap the server card to connect
- tapOn: "Local"

# ── Login as admin ──

- extendedWaitUntil:
    visible:
      text: "Welcome Back"
    timeout: 5000

- tapOn: "Username"
- inputText: "admin"
- hideKeyboard

- tapOn: "Password"
- inputText: "admin123"

- hideKeyboard

- scrollUntilVisible:
    element:
      text: "Sign In"
    direction: DOWN
    timeout: 3000

- tapOn: "Sign In"

# ── Verify we reach the home screen ──

- extendedWaitUntil:
    visible:
      text: "Consoles"
    timeout: 8000
