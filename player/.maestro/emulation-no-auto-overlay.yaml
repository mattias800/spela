appId: com.spela.player
---

# Test: Game starts without overlay (overlay only on back press)
#
# Regression test for bug where the popup menu (with "Exit game" and
# "Continue") appeared immediately when starting a game.
# After the fix, the game starts directly into gameplay, and the
# overlay only appears when the user presses the Android back button.

# ── Setup: fresh start ──

- clearState:
    appId: "com.spela.player"
- launchApp:
    appId: "com.spela.player"

# ── Add server ──

- extendedWaitUntil:
    visible:
      text: "Connect to your game server"
    timeout: 15000

- tapOn: "Add Server"

- extendedWaitUntil:
    visible:
      text: "Server Name"
    timeout: 5000

- tapOn: "Server Name"
- inputText: "Local"

- tapOn: "Server URL"
- inputText: "http://192.168.11.143:8080"

- tapOn: "Add"
- tapOn: "Local"

# ── Login as player ──

- extendedWaitUntil:
    visible:
      text: "Welcome Back"
    timeout: 10000

- tapOn: "Username"
- inputText: "player"

- tapOn: "Password"
- inputText: "player123"

- hideKeyboard
- tapOn: "Sign In"

# ── Home screen ──

- extendedWaitUntil:
    visible:
      text: "Consoles"
    timeout: 15000

# ── Navigate to NES > Castlevania ──

- scrollUntilVisible:
    element:
      text: ".*Nintendo Entertainment System.*"
    direction: DOWN

- tapOn:
    text: ".*Nintendo Entertainment System.*"

- scrollUntilVisible:
    element:
      text: ".*Castlevania.*"
    direction: DOWN

- tapOn:
    text: ".*Castlevania.*"

- extendedWaitUntil:
    visible:
      text: "About"
    timeout: 5000

- tapOn: "Download"

- extendedWaitUntil:
    visible:
      text: "Play"
    timeout: 15000

# ── Start the game ──

- tapOn: "Play"

# ── CRITICAL ASSERTION: Overlay should NOT appear automatically ──
# Wait a moment for game to start, then verify no overlay is showing.

- swipe:
    start: "50%,50%"
    end: "50%,50%"
    duration: 3000

# The overlay elements should NOT be visible during active gameplay
- assertNotVisible: "Exit Game"
- assertNotVisible: "Continue"

# ── Touch controls SHOULD be visible (game is in active gameplay) ──

- assertVisible: "Touch controls"

# ── Press back to open overlay ──

- pressKey: "back"

# ── Verify overlay now appears ──

- extendedWaitUntil:
    visible:
      text: "Exit Game"
    timeout: 5000

- assertVisible: "Continue"
- assertVisible: "Save"
- assertVisible: "Load"

# ── Verify game is paused (overlay visible means game paused) ──
# Touch controls should be hidden while overlay is showing

- assertNotVisible: "Touch controls"

# ── Dismiss overlay and verify gameplay resumes ──

- tapOn: "Continue"

- swipe:
    start: "50%,50%"
    end: "50%,50%"
    duration: 1500

# Overlay gone, touch controls back
- assertNotVisible: "Exit Game"
- assertVisible: "Touch controls"

# ── Clean up ──

- pressKey: "back"

- extendedWaitUntil:
    visible:
      text: "Exit Game"
    timeout: 5000

- tapOn: "Exit Game"
