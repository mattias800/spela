appId: com.spela.player
---

# Test: Dual-screen regression — single-screen behavior unchanged
#
# Verifies that after dual-screen support is added, the standard single-screen
# emulation experience (no secondary display connected) works identically:
# touch controls appear, overlay opens/closes, game exits cleanly.
#
# NOTE: Maestro cannot interact with Android secondary displays (Presentation).
# Dual-screen logic is covered by unit tests. This E2E test ensures the
# single-screen path has no regressions.

# ── Setup: login as player ──

- runFlow: setup/start-logged-in.yaml

# ── Navigate to NES console ──

- scrollUntilVisible:
    element:
      text: ".*Nintendo Entertainment System.*"
    direction: DOWN

- tapOn:
    text: ".*Nintendo Entertainment System.*"

# ── Find and tap Castlevania ──

- scrollUntilVisible:
    element:
      text: ".*Castlevania.*"
    direction: DOWN

- tapOn:
    text: ".*Castlevania.*"

# ── Wait for game detail screen ──

- extendedWaitUntil:
    visible:
      text: "About"
    timeout: 3000

# ── Download the game if needed ──

- runFlow:
    when:
      visible: "Download"
    file: setup/download-game.yaml

- tapOn: "Play"

# ── Wait for game to render ──

- extendedWaitUntil:
    visible:
      text: "Touch controls"
    timeout: 5000

# ── ASSERTION 1: Touch controls visible on primary screen (no secondary display) ──

- assertVisible: "Touch controls"
- assertVisible: "D-pad Up"
- assertVisible: "D-pad Down"
- assertVisible: "D-pad Left"
- assertVisible: "D-pad Right"
- assertVisible: "Button A"
- assertVisible: "Button B"
- assertVisible: "Button Start"
- assertVisible: "Button Select"

# ── ASSERTION 2: Open overlay, touch controls should hide ──

- pressKey: "back"

- extendedWaitUntil:
    visible:
      text: "Exit Game"
    timeout: 5000

- assertNotVisible: "Touch controls"

# ── ASSERTION 3: Overlay has all expected controls ──

- assertVisible: "Continue"
- assertVisible: "Save"
- assertVisible: "Load"
- assertVisible: "Screenshot"
- assertVisible: "Fast"
- assertVisible: "Exit Game"

# ── ASSERTION 4: Dismiss overlay, touch controls return ──

- tapOn: "Continue"

- extendedWaitUntil:
    notVisible:
      text: "Exit Game"
    timeout: 3000

- assertVisible: "Touch controls"
- assertVisible: "D-pad Up"
- assertVisible: "Button A"

# ── Clean up: exit game ──

- pressKey: "back"

- extendedWaitUntil:
    visible:
      text: "Exit Game"
    timeout: 5000

- tapOn: "Exit Game"
