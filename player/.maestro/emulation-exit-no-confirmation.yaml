appId: com.spela.player
---

# Test: Exit game without confirmation when auto-save is enabled
#
# When auto-save is enabled (default), tapping "Exit Game" should
# immediately exit without showing a confirmation dialog, because
# progress is automatically saved.
#
# When auto-save is NOT enabled, a confirmation dialog should appear:
# Title: "Exit without saving?"
# Message: "This game doesn't support save states. Any unsaved progress will be lost."
# Buttons: "Keep Playing" + "Exit Anyway"

# ── Setup: fresh start ──

- clearState:
    appId: "com.spela.player"
- launchApp:
    appId: "com.spela.player"

# ── Add server ──

- extendedWaitUntil:
    visible:
      text: "Connect to your game server"
    timeout: 15000

- tapOn: "Add Server"

- extendedWaitUntil:
    visible:
      text: "Server Name"
    timeout: 5000

- tapOn: "Server Name"
- inputText: "Local"

- tapOn: "Server URL"
- inputText: "http://192.168.11.143:8080"

- tapOn: "Add"
- tapOn: "Local"

# ── Login as player ──

- extendedWaitUntil:
    visible:
      text: "Welcome Back"
    timeout: 10000

- tapOn: "Username"
- inputText: "player"

- tapOn: "Password"
- inputText: "player123"

- hideKeyboard
- tapOn: "Sign In"

# ── Home screen ──

- extendedWaitUntil:
    visible:
      text: "Consoles"
    timeout: 15000

# ── Ensure auto-save is enabled in Settings ──

- tapOn: "Settings"

- extendedWaitUntil:
    visible:
      text: "Emulation"
    timeout: 5000

# Verify "Auto Save on Exit" toggle is visible
- assertVisible: "Auto Save on Exit"

# Navigate back to home
- pressKey: "back"

- extendedWaitUntil:
    visible:
      text: "Consoles"
    timeout: 5000

# ── Navigate to NES > Castlevania ──

- scrollUntilVisible:
    element:
      text: ".*Nintendo Entertainment System.*"
    direction: DOWN

- tapOn:
    text: ".*Nintendo Entertainment System.*"

- scrollUntilVisible:
    element:
      text: ".*Castlevania.*"
    direction: DOWN

- tapOn:
    text: ".*Castlevania.*"

- extendedWaitUntil:
    visible:
      text: "About"
    timeout: 5000

- tapOn: "Download"

- extendedWaitUntil:
    visible:
      text: "Play"
    timeout: 15000

# ── Start the game ──

- tapOn: "Play"

# ── Wait for game to start ──

- swipe:
    start: "50%,50%"
    end: "50%,50%"
    duration: 3000

# ── Open overlay via back button ──

- pressKey: "back"

- extendedWaitUntil:
    visible:
      text: "Exit Game"
    timeout: 10000

# ── Tap Exit Game ──
# With auto-save enabled, this should immediately exit (no confirmation dialog)

- tapOn: "Exit Game"

# ── CRITICAL ASSERTION: No confirmation dialog should appear ──
# We should go directly to the game detail screen without seeing
# the exit confirmation dialog.

- extendedWaitUntil:
    visible:
      text: "Play"
    timeout: 10000

# Verify we're on the game detail screen (not a dialog)
- assertNotVisible: "Exit without saving?"
- assertNotVisible: "Any unsaved progress will be lost"
- assertNotVisible: "Keep Playing"
- assertNotVisible: "Exit Anyway"

# Verify the game detail screen elements are present
- assertVisible:
    text: ".*Castlevania.*"
