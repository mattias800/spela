appId: com.spela.player
---

# Test: In-game overlay shows all action buttons
#
# Verifies that after starting a game, the overlay panel displays
# the game title, performance stats, and all action buttons
# (Save, Load, Screenshot, Fast, Exit Game, Continue).

# ── Setup: login as player ──

- runFlow: setup/start-logged-in.yaml

# ── Navigate to NES console ──

- scrollUntilVisible:
    element:
      text: ".*Nintendo Entertainment System.*"
    direction: DOWN

- tapOn:
    text: ".*Nintendo Entertainment System.*"

# ── Find and tap Castlevania ──

- scrollUntilVisible:
    element:
      text: ".*Castlevania.*"
    direction: DOWN

- tapOn:
    text: ".*Castlevania.*"

# ── Wait for game detail screen ──

- extendedWaitUntil:
    visible:
      text: "About"
    timeout: 3000

# ── Download the game if needed ──

- tapOn: "Download"

- extendedWaitUntil:
    visible:
      text: "Play"
    timeout: 8000

# ── Tap Play ──

- tapOn: "Play"

# ── Wait for game to render ──

- extendedWaitUntil:
    visible:
      text: "Touch controls"
    timeout: 5000

# ── Open overlay via back button ──

- pressKey: "back"

# ── Assert the overlay appears with all controls ──

- extendedWaitUntil:
    visible:
      text: "Exit Game"
    timeout: 5000

- assertVisible: "Continue"

- assertVisible:
    text: "Save"

- assertVisible:
    text: "Load"

- assertVisible:
    text: "Screenshot"

- assertVisible:
    text: "Fast"

# ── Assert game title is shown in overlay ──

- assertVisible:
    text: ".*Castlevania.*"

# ── Assert performance stats are visible (proves emulation is actually running) ──
# The performance row only renders when state.isRunning is true.
# If the native library fails to load or the core fails to start,
# isRunning stays false and no FPS/frame time badge appears.
# The PerformanceBadge shows "FPS" as a label and the "Frame" badge
# shows the frame time. We look for "Frame" as it is unique to
# the performance section (no other UI element has that text).

- extendedWaitUntil:
    visible:
      text: "Frame"
    timeout: 15000

# ── Exit game to clean up ──

- tapOn: "Exit Game"
