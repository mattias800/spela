appId: com.spela.player
---

# Test: Shader preview image is visible in settings
#
# Verifies that the shader preview section in Settings shows a preview
# image for both the global default shader and per-console shader.
#
# Per-console shader preview is on ConsoleSettingsScreen.

# ── Setup: login as player ──

- runFlow: setup/start-logged-in.yaml

# ── Navigate to Settings ──

- tapOn: "Settings"

- extendedWaitUntil:
    visible:
      text: "Account"
    timeout: 5000

- scrollUntilVisible:
    element:
      text: "Video Filter"
    direction: DOWN
    timeout: 5000

# ── Verify shader options are visible (scroll to ensure they're in viewport) ──

- scrollUntilVisible:
    element:
      text: "CRT Classic"
    direction: DOWN

# ── Select CRT Classic to verify preview updates ──

- tapOn: "CRT Classic"

# ── Scroll down to verify the shader preview canvas is present ──
# The ShaderPreview composable has contentDescription "Shader preview".

- scrollUntilVisible:
    element:
      text: "Shader preview"
    direction: DOWN

- assertVisible: "Shader preview"

- takeScreenshot: shader-preview-default

# ── Test per-console shader preview ──
# Navigate to a ConsoleSettingsScreen

- scrollUntilVisible:
    element:
      text: "Per Console"
    direction: UP

- tapOn: "Per Console"

# ── Tap a console (NES) to open ConsoleSettingsScreen ──

- scrollUntilVisible:
    element:
      text: ".*Nintendo Entertainment System.*"
    direction: DOWN
    timeout: 5000

- tapOn:
    text: ".*Nintendo Entertainment System.*"

# ── Wait for ConsoleSettingsScreen ──

- extendedWaitUntil:
    visible:
      text: "Video Filter"
    timeout: 5000

# ── Scroll to shader preview on ConsoleSettingsScreen ──

- scrollUntilVisible:
    element:
      text: "Shader preview"
    direction: DOWN

- assertVisible: "Shader preview"

- takeScreenshot: shader-preview-nes-console

# ── Test fullscreen preview dialog ──
# Tapping the shader preview opens a fullscreen dialog with "Tap to close".

- tapOn: "Shader preview"

- extendedWaitUntil:
    visible:
      text: "Tap to close"
    timeout: 3000

- takeScreenshot: shader-preview-fullscreen

# Dismiss the dialog
- tapOn: "Tap to close"

# ── Navigate back to Settings ──

- pressKey: "back"

# Verify we're back to settings
- extendedWaitUntil:
    visible:
      text: "Account"
    timeout: 3000
