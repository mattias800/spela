appId: com.spela.player
---

# Test: Shader preview image is visible in settings
#
# Verifies that the shader preview section in Settings shows a preview
# image that can be tapped to open a fullscreen preview dialog.
# The preview image comes from the libretro thumbnail archive via the
# server's /api/consoles/{id}/preview-screenshot endpoint.

# ── Setup: login as player ──

- runFlow: setup/start-logged-in.yaml

# ── Navigate to Settings ──

- tapOn: "Settings"

- scrollUntilVisible:
    element:
      text: "Video Filter"
    direction: DOWN
    timeout: 5000

# ── Verify shader options are visible (scroll to ensure they're in viewport) ──

- scrollUntilVisible:
    element:
      text: ".*CRT Classic.*"
    direction: DOWN

# ── Select CRT Classic to verify preview updates ──

- tapOn:
    text: ".*CRT Classic.*"

# ── Scroll down to see the shader preview ──

- scrollUntilVisible:
    element:
      text: "Storage"
    direction: DOWN

# ── Take a screenshot to visually verify shader preview is rendered ──
# The ShaderPreview composable uses a Canvas so it doesn't have a
# text-based contentDescription. We verify it visually via screenshot.

- takeScreenshot: shader-preview-default

# ── Test per-console shader preview ──
# Switch to "Per Console" tab

- scrollUntilVisible:
    element:
      text: "Per Console"
    direction: UP

- tapOn: "Per Console"

# ── Expand a console (e.g., NES) to see its shader preview ──

- scrollUntilVisible:
    element:
      text: ".*Nintendo Entertainment System.*"
    direction: DOWN
    timeout: 5000

- tapOn:
    text: ".*Nintendo Entertainment System.*"

# ── Scroll down to see shader options and preview for the console ──

- scrollUntilVisible:
    element:
      text: "Override on this device only"
    direction: DOWN

# ── Take a screenshot to verify console-specific shader preview ──

- takeScreenshot: shader-preview-nes-console

# ── Test fullscreen preview dialog ──
# The ShaderPreview has a clickable modifier that triggers fullscreen.
# We look for "Tap to close" text that appears in the fullscreen dialog.
# Since the preview is a Canvas, tap at a location where it should be.

- scrollUntilVisible:
    element:
      text: "Override on this device only"
    direction: DOWN

# Tap the shader preview canvas to open fullscreen preview
- tapOn: "Shader preview"

# If fullscreen preview opened, "Tap to close" should be visible
- extendedWaitUntil:
    visible:
      text: "Tap to close"
    timeout: 3000

# Take screenshot of fullscreen preview
- takeScreenshot: shader-preview-fullscreen

# Dismiss by tapping
- tapOn: "Tap to close"

# Verify we're back to settings
- scrollUntilVisible:
    element:
      text: "Video Filter"
    direction: UP
    timeout: 5000
