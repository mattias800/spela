appId: com.spela.player
---

# Test: Action buttons (A/B, Start/Select) are tappable
#
# Verifies that all action buttons in the touch controls overlay can be
# tapped without crashing the app or disrupting emulation.

# -- Setup: login as player --

- runFlow: setup/login-player.yaml

# -- Navigate to NES > Castlevania --

- scrollUntilVisible:
    element:
      text: ".*Nintendo Entertainment System.*"
    direction: DOWN

- tapOn:
    text: ".*Nintendo Entertainment System.*"

- scrollUntilVisible:
    element:
      text: ".*Castlevania.*"
    direction: DOWN

- tapOn:
    text: ".*Castlevania.*"

- extendedWaitUntil:
    visible:
      text: "About"
    timeout: 3000

- tapOn: "Download"

- extendedWaitUntil:
    visible:
      text: "Play"
    timeout: 8000

- tapOn: "Play"

# -- Wait for game to render --

- extendedWaitUntil:
    visible:
      text: "Touch controls"
    timeout: 5000

# -- Tap face buttons --

- tapOn: "Button A"
- tapOn: "Button B"

# -- Tap system buttons --

- tapOn: "Button Start"
- tapOn: "Button Select"

# -- Verify game is still running by reopening overlay --

- pressKey: "back"

- extendedWaitUntil:
    visible:
      text: "Exit Game"
    timeout: 5000

- assertVisible: "Continue"

# -- Clean up --

- tapOn: "Exit Game"
