appId: com.spela.player
---

# Test: Server connection and login flow works in landscape orientation
#
# The Odin 2 Mini and other gaming handhelds use landscape orientation by
# default. This test verifies the add-server and sign-in screens are usable
# in landscape mode — all fields visible, scrollable, and tappable.

# ── Setup: fresh start in landscape ──

- clearState:
    appId: "com.spela.player"
- stopApp:
    appId: "com.spela.player"
- launchApp:
    appId: "com.spela.player"

# ── Add server in landscape ──

- extendedWaitUntil:
    visible:
      text: "Connect to your game server"
    timeout: 8000

- tapOn: "Add Server"

- extendedWaitUntil:
    visible:
      text: "Server Name"
    timeout: 3000

- tapOn: "Server Name"
- inputText: "Local"
- hideKeyboard

- scrollUntilVisible:
    element:
      text: "Server URL"
    direction: DOWN
    timeout: 3000

- tapOn: "Server URL"
- inputText: "http://192.168.11.143:8080"
- hideKeyboard

- scrollUntilVisible:
    element:
      text: "Add"
    direction: DOWN
    timeout: 3000

- tapOn: "Add"

# ── Select server ──

- tapOn: "Local"

# ── Login screen should be usable in landscape ──
# All form fields must be reachable by scrolling

- extendedWaitUntil:
    visible:
      text: "Welcome Back"
    timeout: 5000

- tapOn: "Username"
- inputText: "player"
- hideKeyboard

- tapOn: "Password"
- inputText: "player123"
- hideKeyboard

# ── Sign In button must be visible (scrollable to) and tappable ──

- scrollUntilVisible:
    element:
      text: "Sign In"
    direction: DOWN

- tapOn: "Sign In"

# ── Verify we reach the home screen ──

- extendedWaitUntil:
    visible:
      text: "Consoles"
    timeout: 8000
