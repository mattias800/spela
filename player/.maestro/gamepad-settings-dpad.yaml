appId: com.spela.player
---

# Test: D-pad navigation on Settings screen
#
# Verifies that the Settings screen can be navigated with D-pad keys.
# Tests that shader options are focusable and activatable via
# DPAD_CENTER. The Settings tab is accessed via touch first, then
# all further interaction is D-pad only.
#
# Uses Maestro's "Remote Dpad" keys.
#
# NOTE: Scrolls past the Account section (text field, Sign Out button)
# to avoid activating them via D-pad. On the Odin 2, the keyboard
# covers the entire landscape screen.

# ── Setup: login as player ──

- runFlow: setup/start-logged-in.yaml

# ── Navigate to Settings tab via touch ──

- tapOn: "Settings"

# ── Scroll well past Account section to the shader area ──
# This ensures the Device Name text field and Sign Out button are
# off-screen and won't capture D-pad focus.

- scrollUntilVisible:
    element:
      text: "Video Filter"
    direction: DOWN
    timeout: 5000

# ── Use D-pad to navigate through shader options ──
# Shader radio buttons are safe to activate — they just select a shader.

- pressKey: "Remote Dpad Down"
- pressKey: "Remote Dpad Down"
- pressKey: "Remote Dpad Down"

# ── Activate a shader option with DPAD_CENTER ──
# This tests that shader radio buttons are focusable and clickable
# via D-pad.

- pressKey: "Remote Dpad Center"

# ── Navigate down through more options ──

- pressKey: "Remote Dpad Down"
- pressKey: "Remote Dpad Down"
- pressKey: "Remote Dpad Down"

# ── Activate another option ──

- pressKey: "Remote Dpad Center"

# ── Navigate down further ──

- pressKey: "Remote Dpad Down"
- pressKey: "Remote Dpad Down"

# ── Verify we're still on the Settings screen ──

- assertVisible: "Settings"

# ── Verify we can scroll back to known content ──

- scrollUntilVisible:
    element:
      text: "Video Filter"
    direction: UP
    timeout: 5000
