appId: com.spela.player
---

# Test: Back button during emulation should toggle overlay
#
# Verifies that pressing the Android back button during active gameplay
# opens the overlay (instead of navigating away from the game).
#
# NOTE: The shared NavigationViewModel does not currently intercept back
# press during emulation. The Android Activity must handle this by calling
# EmulationIntent.ToggleOverlay when the in-game overlay is active.
# If the back button navigates away instead, this test will FAIL,
# indicating a missing back-press handler -- which is itself a bug.

# ── Setup: fresh start ──

- clearState:
    appId: "com.spela.player"
- launchApp:
    appId: "com.spela.player"

# ── Add server ──

- extendedWaitUntil:
    visible:
      text: "Connect to your game server"
    timeout: 15000

- tapOn: "Add Server"

- extendedWaitUntil:
    visible:
      text: "Server Name"
    timeout: 5000

- tapOn: "Server Name"
- inputText: "Local"

- tapOn: "Server URL"
- inputText: "http://192.168.11.143:8080"

- tapOn: "Add"
- tapOn: "Local"

# ── Login as player ──

- extendedWaitUntil:
    visible:
      text: "Welcome Back"
    timeout: 10000

- tapOn: "Username"
- inputText: "player"

- tapOn: "Password"
- inputText: "player123"

- hideKeyboard
- tapOn: "Sign In"

# ── Home screen ──

- extendedWaitUntil:
    visible:
      text: "Consoles"
    timeout: 15000

# ── Navigate to NES > Castlevania ──

- scrollUntilVisible:
    element:
      text: ".*Nintendo Entertainment System.*"
    direction: DOWN

- tapOn:
    text: ".*Nintendo Entertainment System.*"

- scrollUntilVisible:
    element:
      text: ".*Castlevania.*"
    direction: DOWN

- tapOn:
    text: ".*Castlevania.*"

- extendedWaitUntil:
    visible:
      text: "About"
    timeout: 5000

- tapOn: "Download"

- extendedWaitUntil:
    visible:
      text: "Play"
    timeout: 15000

- tapOn: "Play"

# ── Wait for game to start (overlay no longer auto-shows) ──

- swipe:
    start: "50%,50%"
    end: "50%,50%"
    duration: 3000

# ── Press the Android back button ──
# Expected behavior: the overlay should open (not navigate away).
# If the app navigates away from the game instead, this assertion
# will fail, catching a missing back-press handler.

- pressKey: "back"

# ── Verify the overlay opens ──

- extendedWaitUntil:
    visible:
      text: "Exit Game"
    timeout: 5000

- assertVisible: "Continue"

# ── Dismiss overlay and verify it can be reopened ──

- tapOn: "Continue"

- swipe:
    start: "50%,50%"
    end: "50%,50%"
    duration: 1500

- pressKey: "back"

- extendedWaitUntil:
    visible:
      text: "Exit Game"
    timeout: 5000

- assertVisible: "Continue"

# ── Exit the game cleanly ──

- tapOn: "Exit Game"
