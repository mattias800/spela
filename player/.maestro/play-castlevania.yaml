appId: com.spela.player
---

# Test: Tapping "Play" on Castlevania should start the game
#
# This test exposes a bug where tapping the Play button on the
# GameDetailScreen does not start the game / show the in-game overlay.

# ── Setup: login as player ──

- runFlow: setup/start-logged-in.yaml

# ── Navigate to NES console ──

- scrollUntilVisible:
    element:
      text: ".*Nintendo Entertainment System.*"
    direction: DOWN

- tapOn:
    text: ".*Nintendo Entertainment System.*"

# ── Find and tap Castlevania ──

- scrollUntilVisible:
    element:
      text: ".*Castlevania.*"
    direction: DOWN

- tapOn:
    text: ".*Castlevania.*"

# ── Wait for game detail screen ──

- extendedWaitUntil:
    visible:
      text: "About"
    timeout: 3000

# ── Download the game ──

# Download the game if not already downloaded
- runFlow:
    when:
      visible: "Download"
    file: setup/download-game.yaml

- tapOn: "Play"

# ── Wait for game to render ──

- extendedWaitUntil:
    visible:
      text: "Touch controls"
    timeout: 5000

# ── Open overlay via back button ──

- pressKey: "back"

- extendedWaitUntil:
    visible:
      text: "Exit Game"
    timeout: 5000
