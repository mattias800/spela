appId: com.spela.player
---

# Test: Touch controls survive multiple overlay open/close cycles
#
# Verifies that the touch controls correctly appear and disappear
# across multiple cycles of opening and closing the in-game overlay.
# This catches state management bugs where the visibility condition
# (isRunning && !showOverlay) might get out of sync.

# -- Setup: login as player --

- runFlow: setup/start-logged-in.yaml

# -- Navigate to NES > Castlevania --

- scrollUntilVisible:
    element:
      text: ".*Nintendo Entertainment System.*"
    direction: DOWN

- tapOn:
    text: ".*Nintendo Entertainment System.*"

- scrollUntilVisible:
    element:
      text: ".*Castlevania.*"
    direction: DOWN

- tapOn:
    text: ".*Castlevania.*"

- extendedWaitUntil:
    visible:
      text: "About"
    timeout: 3000

- tapOn: "Download"

- extendedWaitUntil:
    visible:
      text: "Play"
    timeout: 8000

- tapOn: "Play"

# -- Wait for game to render --

- extendedWaitUntil:
    visible:
      text: "Touch controls"
    timeout: 5000

# -- Cycle 1: Touch controls visible during gameplay --

- assertVisible: "Touch controls"
- assertVisible: "D-pad Up"
- assertVisible: "Button A"

# -- Cycle 1: Open overlay -> touch controls hidden --

- pressKey: "back"

- extendedWaitUntil:
    visible:
      text: "Exit Game"
    timeout: 5000

- assertNotVisible: "Touch controls"

# -- Cycle 1: Dismiss overlay -> touch controls visible --

- tapOn: "Continue"

- extendedWaitUntil:
    notVisible:
      text: "Exit Game"
    timeout: 3000

- assertVisible: "Touch controls"
- assertVisible: "D-pad Up"
- assertVisible: "Button A"

# -- Cycle 2: Reopen overlay via back button --

- pressKey: "back"

- extendedWaitUntil:
    visible:
      text: "Exit Game"
    timeout: 5000

- assertNotVisible: "Touch controls"

# -- Cycle 2: Dismiss overlay via backdrop tap --

- tapOn:
    point: "50%,10%"

- extendedWaitUntil:
    notVisible:
      text: "Exit Game"
    timeout: 3000

- assertVisible: "Touch controls"
- assertVisible: "D-pad Down"
- assertVisible: "Button B"

# -- Cycle 3: Reopen via back, dismiss via Continue --

- pressKey: "back"

- extendedWaitUntil:
    visible:
      text: "Exit Game"
    timeout: 5000

- assertNotVisible: "Touch controls"

- tapOn: "Continue"

- extendedWaitUntil:
    notVisible:
      text: "Exit Game"
    timeout: 3000

- assertVisible: "Touch controls"

# -- Clean up --

- pressKey: "back"

- extendedWaitUntil:
    visible:
      text: "Exit Game"
    timeout: 5000

- tapOn: "Exit Game"
