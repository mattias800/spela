appId: com.spela.player
---

# Test: Screenshot capture
#
# Verifies that tapping the Screenshot button in the overlay does not
# crash the app and the overlay remains functional afterward.

# ── Setup: login as player ──

- runFlow: setup/start-logged-in.yaml

# ── Navigate to NES > Castlevania ──

- scrollUntilVisible:
    element:
      text: ".*Nintendo Entertainment System.*"
    direction: DOWN

- tapOn:
    text: ".*Nintendo Entertainment System.*"

- scrollUntilVisible:
    element:
      text: ".*Castlevania.*"
    direction: DOWN

- tapOn:
    text: ".*Castlevania.*"

- extendedWaitUntil:
    visible:
      text: "About"
    timeout: 3000

# Download the game if not already downloaded
- runFlow:
    when:
      visible: "Download"
    file: setup/download-game.yaml

- tapOn: "Play"

# ── Wait for game to render ──

- extendedWaitUntil:
    visible:
      text: "Touch controls"
    timeout: 5000

# ── Open overlay via back button ──

- pressKey: "back"

- extendedWaitUntil:
    visible:
      text: "Exit Game"
    timeout: 5000

# ── Tap Screenshot ──

- tapOn: "Screenshot"

# ── Verify overlay is still functional (no crash) ──

- extendedWaitUntil:
    visible:
      text: "Exit Game"
    timeout: 3000

- assertVisible: "Continue"
- assertVisible: "Save"
- assertVisible: "Load"

# ── Exit game to clean up ──

- tapOn: "Exit Game"
