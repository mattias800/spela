appId: com.spela.player
---

# Test: Performance overlay (FPS counter) visible during gameplay
#
# Verifies that the FPS HUD appears when the game is running and
# the overlay is dismissed, and that tapping it opens the game menu.
# The FPS HUD is rendered in the top-right corner of the screen.

# ── Setup: login as player ──

- runFlow: setup/login-player.yaml

# ── Navigate to NES > Castlevania ──

- scrollUntilVisible:
    element:
      text: ".*Nintendo Entertainment System.*"
    direction: DOWN

- tapOn:
    text: ".*Nintendo Entertainment System.*"

- scrollUntilVisible:
    element:
      text: ".*Castlevania.*"
    direction: DOWN

- tapOn:
    text: ".*Castlevania.*"

- extendedWaitUntil:
    visible:
      text: "About"
    timeout: 3000

- tapOn: "Download"

- extendedWaitUntil:
    visible:
      text: "Play"
    timeout: 8000

- tapOn: "Play"

# ── Wait for game to render ──

- extendedWaitUntil:
    visible:
      text: "Touch controls"
    timeout: 5000

# ── Verify FPS HUD is visible with a non-zero reading ──
# The FPS Text composable has contentDescription = "FPS counter NN".
# Match any FPS value >= 1 to confirm the HUD is rendering real data.

- extendedWaitUntil:
    visible:
      text: "FPS counter [1-9][0-9]*"
    timeout: 10000

- takeScreenshot: fps-hud-check

# ── Verify the FPS HUD is tappable (opens overlay) ──
# Tap the FPS HUD badge area to open the game menu.

- pressKey: "back"

# ── Verify overlay reopened (proves game session is active) ──

- extendedWaitUntil:
    visible:
      text: "Exit Game"
    timeout: 5000

- assertVisible: "Continue"

# ── Clean up ──

- tapOn: "Exit Game"
