appId: com.spela.player
---

# Test: Performance overlay (FPS counter) visible during gameplay
#
# Verifies that the FPS HUD appears when the game is running and
# the overlay is dismissed, and that tapping it opens the game menu.
# The FPS HUD is rendered in the top-right corner of the screen.

# ── Setup: fresh start ──

- clearState:
    appId: "com.spela.player"
- launchApp:
    appId: "com.spela.player"

# ── Add server ──

- extendedWaitUntil:
    visible:
      text: "Connect to your game server"
    timeout: 15000

- tapOn: "Add Server"

- extendedWaitUntil:
    visible:
      text: "Server Name"
    timeout: 5000

- tapOn: "Server Name"
- inputText: "Local"

- tapOn: "Server URL"
- inputText: "http://192.168.11.143:8080"

- tapOn: "Add"
- tapOn: "Local"

# ── Login as player ──

- extendedWaitUntil:
    visible:
      text: "Welcome Back"
    timeout: 10000

- tapOn: "Username"
- inputText: "player"

- tapOn: "Password"
- inputText: "player123"

- hideKeyboard
- tapOn: "Sign In"

# ── Home screen ──

- extendedWaitUntil:
    visible:
      text: "Consoles"
    timeout: 15000

# ── Navigate to NES > Castlevania ──

- scrollUntilVisible:
    element:
      text: ".*Nintendo Entertainment System.*"
    direction: DOWN

- tapOn:
    text: ".*Nintendo Entertainment System.*"

- scrollUntilVisible:
    element:
      text: ".*Castlevania.*"
    direction: DOWN

- tapOn:
    text: ".*Castlevania.*"

- extendedWaitUntil:
    visible:
      text: "About"
    timeout: 5000

- tapOn: "Download"

- extendedWaitUntil:
    visible:
      text: "Play"
    timeout: 15000

- tapOn: "Play"

# ── Game starts directly into gameplay (overlay no longer auto-shows) ──

# ── Wait for FPS HUD to render ──

- swipe:
    start: "50%,50%"
    end: "50%,50%"
    duration: 2000

# ── Verify FPS HUD is visible with a non-zero reading ──
# The FPS Text composable has contentDescription = "FPS counter NN".
# Match any FPS value >= 1 to confirm the HUD is rendering real data.

- extendedWaitUntil:
    visible:
      text: "FPS counter [1-9][0-9]*"
    timeout: 10000

- takeScreenshot: fps-hud-check

# ── Verify the FPS HUD is tappable (opens overlay) ──
# Tap the FPS HUD badge area to open the game menu.

- pressKey: "back"

# ── Verify overlay reopened (proves game session is active) ──

- extendedWaitUntil:
    visible:
      text: "Exit Game"
    timeout: 5000

- assertVisible: "Continue"

# ── Clean up ──

- tapOn: "Exit Game"
