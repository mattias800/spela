appId: com.spela.player
---

# Test: RetroAchievements section visible in Settings
#
# Verifies that the RetroAchievements section is present in Settings,
# shows the "Link Account" button when not linked, and opens the
# link dialog when tapped.

# ── Setup: login as player ──

- runFlow: setup/login-player.yaml

# ── Navigate to Settings ──

- tapOn: "Settings"

- extendedWaitUntil:
    visible:
      text: "Account"
    timeout: 5000

# ── Scroll to RetroAchievements section ──

- scrollUntilVisible:
    element:
      text: "RetroAchievements"
    direction: DOWN
    timeout: 5000

# ── Assert section header is visible ──

- assertVisible:
    text: "RetroAchievements"

# ── Assert "Link Account" button is visible (not linked state) ──

- scrollUntilVisible:
    element:
      text: "Link Account"
    direction: DOWN

- assertVisible:
    text: "Link Account"

# ── Assert description text is shown ──

- assertVisible:
    text: "Link your RetroAchievements account to earn achievements while playing."

# ── Tap "Link Account" to open the dialog ──

- tapOn: "Link Account"

# ── Assert link dialog appears ──

- extendedWaitUntil:
    visible:
      text: "Link RetroAchievements"
    timeout: 3000

- assertVisible:
    text: "Link RetroAchievements"

# ── Assert dialog has username and password fields ──

- assertVisible:
    text: "Username"

- assertVisible:
    text: "Password"

# ── Assert privacy note in dialog ──

- assertVisible:
    text: "Your password is only used to obtain a token"

# ── Dismiss dialog ──

- tapOn: "Cancel"

# ── Assert dialog is dismissed ──

- extendedWaitUntil:
    notVisible:
      text: "Link RetroAchievements"
    timeout: 3000

# ── Verify we're back on Settings screen ──

- assertVisible:
    text: "RetroAchievements"
