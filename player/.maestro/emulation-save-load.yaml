appId: com.spela.player
---

# Test: Save and Load state flow
#
# Verifies that the user can save the current emulation state and then
# load it back. After saving, closing the overlay, reopening, and
# loading should restore the state without error.

# ── Setup: login as player ──

- runFlow: setup/start-logged-in.yaml

# ── Navigate to NES > Castlevania ──

- scrollUntilVisible:
    element:
      text: ".*Nintendo Entertainment System.*"
    direction: DOWN

- tapOn:
    text: ".*Nintendo Entertainment System.*"

- scrollUntilVisible:
    element:
      text: ".*Castlevania.*"
    direction: DOWN

- tapOn:
    text: ".*Castlevania.*"

- extendedWaitUntil:
    visible:
      text: "About"
    timeout: 3000

# Download the game if not already downloaded
- runFlow:
    when:
      visible: "Download"
    file: setup/download-game.yaml

- tapOn: "Play"

# ── Wait for game to render ──

- extendedWaitUntil:
    visible:
      text: "Touch controls"
    timeout: 5000

# ── Open overlay via back button ──

- pressKey: "back"

- extendedWaitUntil:
    visible:
      text: "Exit Game"
    timeout: 5000

# ── Save the game state ──

- tapOn: "Save"

# Wait briefly for save to complete
- extendedWaitUntil:
    visible:
      text: "Continue"
    timeout: 3000

# ── Dismiss overlay by tapping Continue ──

- tapOn: "Continue"

# ── Let the game run for a moment, then reopen overlay ──

- pressKey: "back"

- extendedWaitUntil:
    visible:
      text: "Exit Game"
    timeout: 5000

# ── Load the saved state ──

- tapOn: "Load"

# Wait briefly for load to complete
- extendedWaitUntil:
    visible:
      text: "Continue"
    timeout: 3000

# ── Verify overlay is still showing (no crash after load) ──

- assertVisible: "Exit Game"
- assertVisible: "Continue"
- assertVisible: "Save"

# ── Exit game to clean up ──

- tapOn: "Exit Game"
