appId: com.spela.player
---

# Test: Device-local shader override for a specific console
#
# Verifies that enabling "Override on this device only" for a console
# stores a device-local shader preference, which persists across
# navigation and is distinct from the server-synced per-console shader.
#
# Per-console shader is configured on ConsoleSettingsScreen.

# ── Setup: login as player ──

- runFlow: setup/start-logged-in.yaml

# ── Navigate to Settings ──

- tapOn: "Settings"

- extendedWaitUntil:
    visible:
      text: "Account"
    timeout: 5000

# ── Set global shader to CRT Classic on Default tab ──

- scrollUntilVisible:
    element:
      text: "Video Filter"
    direction: DOWN
    timeout: 5000

- scrollUntilVisible:
    element:
      text: "CRT Classic"
    direction: DOWN

- tapOn: "CRT Classic"

# ── Switch to Per Console tab ──

- scrollUntilVisible:
    element:
      text: "Per Console"
    direction: UP

- tapOn: "Per Console"

# ── Tap Super Nintendo to open ConsoleSettingsScreen ──

- scrollUntilVisible:
    element:
      text: "Super Nintendo"
    direction: DOWN

- tapOn: "Super Nintendo"

# ── Wait for ConsoleSettingsScreen ──

- extendedWaitUntil:
    visible:
      text: "Video Filter"
    timeout: 5000

# ── Enable device override ──

- scrollUntilVisible:
    element:
      text: "Override on this device only"
    direction: DOWN

- tapOn: "Override on this device only"

# ── Select Smooth (Bilinear) as the device override shader ──
# The ConsoleSettingsScreen has two shader lists with the same names:
# per-console and device. Use the "below" selector to tap the Bilinear
# option that is below the "Device Shader" heading.

- scrollUntilVisible:
    element:
      text: "Device Shader"
    direction: DOWN
    timeout: 10000
    centerElement: true

- tapOn: "Smooth.*Bilinear.*"

# ── Navigate back to Settings ──

- pressKey: "back"

- extendedWaitUntil:
    visible:
      text: "Account"
    timeout: 5000

# ── Navigate back to Home ──

- pressKey: "back"

- extendedWaitUntil:
    visible:
      text: "Consoles"
    timeout: 3000

# ── Return to Settings ──

- tapOn: "Settings"

- extendedWaitUntil:
    visible:
      text: "Account"
    timeout: 5000

- scrollUntilVisible:
    element:
      text: "Per Console"
    direction: DOWN
    timeout: 5000

# ── Switch to Per Console tab ──

- tapOn: "Per Console"

# ── Verify SNES shows Bilinear with device override indicator ──

- scrollUntilVisible:
    element:
      text: "Super Nintendo"
    direction: DOWN
    timeout: 10000

- assertVisible: "Smooth.*Bilinear.*device.*"
