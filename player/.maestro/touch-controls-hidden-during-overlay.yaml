appId: com.spela.player
---

# Test: Touch controls hidden when in-game overlay is showing
#
# Verifies that the touch gamepad overlay disappears when the in-game
# overlay (pause menu) is open. This prevents accidental button presses
# behind the overlay and avoids visual clutter.

# -- Setup: login as player --

- runFlow: setup/start-logged-in.yaml

# -- Navigate to NES > Castlevania --

- scrollUntilVisible:
    element:
      text: ".*Nintendo Entertainment System.*"
    direction: DOWN

- tapOn:
    text: ".*Nintendo Entertainment System.*"

- scrollUntilVisible:
    element:
      text: ".*Castlevania.*"
    direction: DOWN

- tapOn:
    text: ".*Castlevania.*"

- extendedWaitUntil:
    visible:
      text: "About"
    timeout: 3000

- tapOn: "Download"

- extendedWaitUntil:
    visible:
      text: "Play"
    timeout: 8000

- tapOn: "Play"

# -- Wait for game to render --

- extendedWaitUntil:
    visible:
      text: "Touch controls"
    timeout: 5000

# -- Assert touch controls ARE visible now --

- assertVisible: "Touch controls"
- assertVisible: "D-pad Up"
- assertVisible: "Button A"
- assertVisible: "Button Start"

# -- Reopen overlay via back button --

- pressKey: "back"

- extendedWaitUntil:
    visible:
      text: "Exit Game"
    timeout: 5000

# -- Assert touch controls are hidden while overlay is showing --

- assertNotVisible: "Touch controls"
- assertNotVisible: "D-pad Up"
- assertNotVisible: "Button A"
- assertNotVisible: "Button Start"

# -- Dismiss overlay to verify touch controls return --

- tapOn: "Continue"

- extendedWaitUntil:
    notVisible:
      text: "Exit Game"
    timeout: 3000

- assertVisible: "Touch controls"
- assertVisible: "D-pad Up"

# -- Clean up --

- pressKey: "back"

- extendedWaitUntil:
    visible:
      text: "Exit Game"
    timeout: 5000

- tapOn: "Exit Game"
