appId: com.spela.player
---

# Test: Dismiss overlay by tapping the backdrop
#
# Verifies that the overlay can be dismissed by tapping the
# semi-transparent backdrop area (contentDescription: "Game overlay, tap to dismiss"),
# and that it can be reopened via the FPS HUD.

# ── Setup: fresh start ──

- clearState:
    appId: "com.spela.player"
- launchApp:
    appId: "com.spela.player"

# ── Add server ──

- extendedWaitUntil:
    visible:
      text: "Connect to your game server"
    timeout: 15000

- tapOn: "Add Server"

- extendedWaitUntil:
    visible:
      text: "Server Name"
    timeout: 5000

- tapOn: "Server Name"
- inputText: "Local"

- tapOn: "Server URL"
- inputText: "http://192.168.11.143:8080"

- tapOn: "Add"
- tapOn: "Local"

# ── Login as player ──

- extendedWaitUntil:
    visible:
      text: "Welcome Back"
    timeout: 10000

- tapOn: "Username"
- inputText: "player"

- tapOn: "Password"
- inputText: "player123"

- hideKeyboard
- tapOn: "Sign In"

# ── Home screen ──

- extendedWaitUntil:
    visible:
      text: "Consoles"
    timeout: 15000

# ── Navigate to NES > Castlevania ──

- scrollUntilVisible:
    element:
      text: ".*Nintendo Entertainment System.*"
    direction: DOWN

- tapOn:
    text: ".*Nintendo Entertainment System.*"

- scrollUntilVisible:
    element:
      text: ".*Castlevania.*"
    direction: DOWN

- tapOn:
    text: ".*Castlevania.*"

- extendedWaitUntil:
    visible:
      text: "About"
    timeout: 5000

- tapOn: "Download"

- extendedWaitUntil:
    visible:
      text: "Play"
    timeout: 15000

- tapOn: "Play"

# ── Wait for game to start (overlay no longer auto-shows) ──

- swipe:
    start: "50%,50%"
    end: "50%,50%"
    duration: 3000

# ── Open overlay via back button ──

- pressKey: "back"

- extendedWaitUntil:
    visible:
      text: "Exit Game"
    timeout: 10000

# ── Dismiss overlay by tapping the backdrop ──
# The full-screen backdrop has contentDescription "Game overlay, tap to dismiss".
# However, tapping by text selector hits the center of the element, which is
# where the overlay panel sits (and intercepts clicks). Instead, tap the
# top area of the screen above the panel to hit the backdrop.

- tapOn:
    point: "50%,10%"

# ── Verify overlay is dismissed (Exit Game button should be gone) ──

- extendedWaitUntil:
    notVisible:
      text: "Exit Game"
    timeout: 5000

# ── Verify game is still running by reopening overlay ──
# Use back button to reopen (more reliable than tapping FPS HUD)

- pressKey: "back"

# ── Verify overlay is back ──

- extendedWaitUntil:
    visible:
      text: "Exit Game"
    timeout: 5000

# ── Clean up ──

- tapOn: "Exit Game"
