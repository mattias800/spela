appId: com.spela.player
---

# Test: Added servers persist across app restarts
#
# After adding a server (without logging in), closing and relaunching the app,
# the server should still appear in the server list. This verifies that
# ServerConnectionEntity is persisted to SQLDelight and restored on startup.

# ── Setup: fresh start ──

- clearState:
    appId: "com.spela.player"
- stopApp:
    appId: "com.spela.player"
- launchApp:
    appId: "com.spela.player"

# ── Verify we're on the server connection screen ──

- extendedWaitUntil:
    visible:
      text: "Connect to your game server"
    timeout: 8000

# ── Add a server (but don't select it) ──

- tapOn: "Add Server"

- extendedWaitUntil:
    visible:
      text: "Server Name"
    timeout: 3000

- tapOn: "Server Name"
- inputText: "Local"

- hideKeyboard

- scrollUntilVisible:
    element:
      text: "Server URL"
    direction: DOWN
    timeout: 3000

- tapOn: "Server URL"
- inputText: "http://10.0.2.2:8080"

- hideKeyboard

- scrollUntilVisible:
    element:
      text: "Add"
    direction: DOWN
    timeout: 3000

- tapOn: "Add"

# ── Verify server card appears in the list ──

- extendedWaitUntil:
    visible:
      text: ".*Local.*"
    timeout: 5000

# ── Close the app (without clearing state) and relaunch ──

- stopApp:
    appId: "com.spela.player"
- launchApp:
    appId: "com.spela.player"

# ── Assert the server persisted after restart ──
# After adding the only server, the app may auto-select it on relaunch
# and navigate to Login ("Welcome Back") instead of ServerConnection.
# Either way, the server name "Local" or the login screen should appear.

- extendedWaitUntil:
    visible:
      text: ".*Local.*|.*Welcome.*"
    timeout: 15000
