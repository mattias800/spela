appId: com.spela.player
---

# Test: Added servers persist across app restarts
#
# After adding a server (without logging in), closing and relaunching the app,
# the server should still appear in the server list. This verifies that
# ServerConnectionEntity is persisted to SQLDelight and restored on startup.

# ── Setup: fresh start ──

- clearState:
    appId: "com.spela.player"
- stopApp:
    appId: "com.spela.player"
- launchApp:
    appId: "com.spela.player"

# ── Verify we're on the server connection screen ──

- extendedWaitUntil:
    visible:
      text: "Connect to your game server"
    timeout: 8000

# ── Add a server (but don't select it) ──

- tapOn: "Add Server"

- extendedWaitUntil:
    visible:
      text: "Server Name"
    timeout: 3000

- tapOn: "Server Name"
- inputText: "Local"

- hideKeyboard
- tapOn: "Server URL"
- inputText: "http://192.168.11.143:8080"

- hideKeyboard
- tapOn: "Add"

# ── Verify server card appears in the list ──

- extendedWaitUntil:
    visible:
      text: ".*Local.*"
    timeout: 5000

# ── Close the app (without clearing state) and relaunch ──

- stopApp:
    appId: "com.spela.player"
- launchApp:
    appId: "com.spela.player"

# ── Assert the server is still listed after restart ──
# We added but didn't select the server, so there is no active server.
# RestoreSessionUseCase returns NoSession → ServerConnection screen.
# Wait for the screen to load, then verify the server persisted.

- extendedWaitUntil:
    visible:
      text: "Connect to your game server"
    timeout: 15000

- extendedWaitUntil:
    visible:
      text: ".*Local.*"
    timeout: 8000

# ── Verify we can tap the server to reach login ──

- tapOn:
    text: ".*Local.*"

- extendedWaitUntil:
    visible:
      text: "Welcome Back"
    timeout: 5000
