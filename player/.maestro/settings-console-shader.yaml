appId: com.spela.player
---

# Test: Per-console shader selection persists across navigation
#
# Verifies that selecting a shader for a specific console under the
# "Per Console" tab saves correctly and is still shown after
# navigating away and returning to Settings.
#
# Per-console cards navigate to a dedicated ConsoleSettingsScreen
# where shader selection happens.

# ── Setup: login as player ──

- runFlow: setup/start-logged-in.yaml

# ── Navigate to Settings ──

- tapOn: "Settings"

- extendedWaitUntil:
    visible:
      text: "Account"
    timeout: 5000

# ── Scroll to Video Filter section and Per Console tab ──

- scrollUntilVisible:
    element:
      text: "Per Console"
    direction: DOWN
    timeout: 5000

# ── Switch to Per Console tab ──

- tapOn: "Per Console"

# ── Tap Super Nintendo to open ConsoleSettingsScreen ──

- scrollUntilVisible:
    element:
      text: "Super Nintendo"
    direction: DOWN

- tapOn: "Super Nintendo"

# ── Wait for ConsoleSettingsScreen to load ──

- extendedWaitUntil:
    visible:
      text: "Video Filter"
    timeout: 5000

# ── Select CRT Classic shader for SNES ──

- scrollUntilVisible:
    element:
      text: "CRT Classic"
    direction: DOWN

- tapOn: "CRT Classic"

# ── Navigate back to Settings ──

- pressKey: "back"

- extendedWaitUntil:
    visible:
      text: "Account"
    timeout: 5000

# ── Navigate back to Home ──

- pressKey: "back"

- extendedWaitUntil:
    visible:
      text: "Consoles"
    timeout: 3000

# ── Return to Settings ──

- tapOn: "Settings"

- extendedWaitUntil:
    visible:
      text: "Account"
    timeout: 5000

- scrollUntilVisible:
    element:
      text: "Per Console"
    direction: DOWN
    timeout: 5000

# ── Switch to Per Console tab ──

- tapOn: "Per Console"

# ── Verify SNES still shows CRT Classic as its shader ──
# The console card subtitle displays the effective shader name.

- scrollUntilVisible:
    element:
      text: "Super Nintendo"
    direction: DOWN

- assertVisible: "CRT Classic"
