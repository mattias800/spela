appId: com.spela.player
---

# Test: Shader selection persists across app restarts
#
# Verifies that the selected video filter (shader) is saved to the server
# and restored after app restart.

# ── Setup: login as player ──

- runFlow: setup/login-player.yaml

# ── Navigate to Settings ──

- tapOn: "Settings"

- extendedWaitUntil:
    visible:
      text: "Account"
    timeout: 5000

- scrollUntilVisible:
    element:
      text: "Video Filter"
    direction: DOWN
    timeout: 5000

# ── Assert default shader is "None (Pixel Perfect)" ──
# Scroll further to ensure shader options are in viewport

- scrollUntilVisible:
    element:
      text: "CRT Classic"
    direction: DOWN

# ── Select "CRT Classic" shader ──

- tapOn: "CRT Classic"

# ── Kill and relaunch the app (session persists — no clearState) ──

- stopApp:
    appId: "com.spela.player"
- launchApp:
    appId: "com.spela.player"

# ── Session is restored — expect Home screen ──

- extendedWaitUntil:
    visible:
      text: "Consoles"
    timeout: 15000

# ── Navigate to Settings and verify shader persisted ──

- tapOn: "Settings"

- extendedWaitUntil:
    visible:
      text: "Account"
    timeout: 5000

- scrollUntilVisible:
    element:
      text: "Video Filter"
    direction: DOWN
    timeout: 5000

- scrollUntilVisible:
    element:
      text: "CRT Classic"
    direction: DOWN
