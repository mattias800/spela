appId: com.spela.player
---

# Test: D-pad buttons are tappable
#
# Verifies that all four D-pad directional buttons can be tapped
# without crashing the app or disrupting emulation. After tapping
# each direction, the game should still be running (verifiable by
# reopening the overlay).

# -- Setup: login as player --

- runFlow: setup/login-player.yaml

# -- Navigate to NES > Castlevania --

- scrollUntilVisible:
    element:
      text: ".*Nintendo Entertainment System.*"
    direction: DOWN

- tapOn:
    text: ".*Nintendo Entertainment System.*"

- scrollUntilVisible:
    element:
      text: ".*Castlevania.*"
    direction: DOWN

- tapOn:
    text: ".*Castlevania.*"

- extendedWaitUntil:
    visible:
      text: "About"
    timeout: 3000

- tapOn: "Download"

- extendedWaitUntil:
    visible:
      text: "Play"
    timeout: 8000

- tapOn: "Play"

# -- Wait for game to render --

- extendedWaitUntil:
    visible:
      text: "Touch controls"
    timeout: 5000

# -- Tap each D-pad direction --

- tapOn: "D-pad Up"
- tapOn: "D-pad Down"
- tapOn: "D-pad Left"
- tapOn: "D-pad Right"

# -- Verify game is still running by reopening overlay --

- pressKey: "back"

- extendedWaitUntil:
    visible:
      text: "Exit Game"
    timeout: 5000

- assertVisible: "Continue"

# -- Clean up --

- tapOn: "Exit Game"
