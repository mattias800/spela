appId: com.spela.player
---

# Test: Touch controls appear during active gameplay
#
# Verifies that the touch gamepad overlay (D-pad, A/B, Start/Select)
# is visible when a game is running and the in-game overlay is dismissed.
# The "Touch controls" container should be present with all expected buttons.

# ── Setup: login as player ──

- runFlow: setup/login-player.yaml

# -- Navigate to NES > Castlevania --

- scrollUntilVisible:
    element:
      text: ".*Nintendo Entertainment System.*"
    direction: DOWN

- tapOn:
    text: ".*Nintendo Entertainment System.*"

- scrollUntilVisible:
    element:
      text: ".*Castlevania.*"
    direction: DOWN

- tapOn:
    text: ".*Castlevania.*"

- extendedWaitUntil:
    visible:
      text: "About"
    timeout: 3000

- tapOn: "Download"

- extendedWaitUntil:
    visible:
      text: "Play"
    timeout: 8000

- tapOn: "Play"

# -- Wait for game to render --

- extendedWaitUntil:
    visible:
      text: "Touch controls"
    timeout: 5000

# -- Assert touch controls container is visible --

- assertVisible: "Touch controls"

# -- Assert D-pad buttons are visible --

- assertVisible: "D-pad Up"
- assertVisible: "D-pad Down"
- assertVisible: "D-pad Left"
- assertVisible: "D-pad Right"

# -- Assert action buttons are visible --

- assertVisible: "Button A"
- assertVisible: "Button B"

# -- Assert Start/Select are visible --

- assertVisible: "Button Start"
- assertVisible: "Button Select"

# -- Clean up --

- pressKey: "back"

- extendedWaitUntil:
    visible:
      text: "Exit Game"
    timeout: 5000

- tapOn: "Exit Game"
