appId: com.spela.player
---

# Test: Logout clears tokens but preserves server connections
#
# After logging out, the user should return to the ServerConnection screen
# with their server still listed. On app restart after logout, the app should
# show the Login screen (server remembered, but tokens cleared).
# This verifies that AuthRepository.clearTokens() removes tokens from SQLDelight
# while ServerRepository keeps the server connection intact.

# ── Setup: login as player ──

- runFlow: setup/login-player.yaml

# ── Navigate to Settings and sign out ──

- tapOn: "Settings"

- extendedWaitUntil:
    visible:
      text: "Account"
    timeout: 5000

- extendedWaitUntil:
    visible:
      text: "Sign Out"
    timeout: 3000

- tapOn: "Sign Out"

# ── Confirm sign out in the dialog ──
# Dialog shows title "Sign Out", message about re-entering credentials,
# and a confirm button "Sign Out". We verify the dialog message appeared,
# then tap the last "Sign Out" which is the confirm button.

- extendedWaitUntil:
    visible:
      text: ".*re-enter your credentials.*"
    timeout: 3000

- tapOn:
    text: "Sign Out"
    index: 1

# ── Verify we return to ServerConnection screen with server still listed ──

- extendedWaitUntil:
    visible:
      text: "Connect to your game server"
    timeout: 8000

- assertVisible: "Local"

# ── Close and relaunch to verify tokens are cleared but server persists ──

- stopApp:
    appId: "com.spela.player"
- launchApp:
    appId: "com.spela.player"

# ── After restart, should land on Login (server remembered, tokens cleared) ──
# RestoreSessionUseCase finds active server but no tokens → NeedsLogin

- extendedWaitUntil:
    visible:
      text: "Welcome Back"
    timeout: 8000
