appId: com.spela.player
---

# Test: Settings preferences persist across app restarts
#
# Verifies that emulation preferences (auto-save, auto-load, perf overlay)
# are saved to the server and restored after app restart.

# ── Setup: fresh start ──

- clearState:
    appId: "com.spela.player"
- launchApp:
    appId: "com.spela.player"

# ── Add server ──

- extendedWaitUntil:
    visible:
      text: "Connect to your game server"
    timeout: 15000

- tapOn: "Add Server"

- extendedWaitUntil:
    visible:
      text: "Server Name"
    timeout: 5000

- tapOn: "Server Name"
- inputText: "Local"

- tapOn: "Server URL"
- inputText: "http://192.168.11.143:8080"

- tapOn: "Add"
- tapOn: "Local"

# ── Login as player ──

- extendedWaitUntil:
    visible:
      text: "Welcome Back"
    timeout: 10000

- tapOn: "Username"
- inputText: "player"

- tapOn: "Password"
- inputText: "player123"

- hideKeyboard
- tapOn: "Sign In"

# ── Home screen ──

- extendedWaitUntil:
    visible:
      text: "Consoles"
    timeout: 15000

# ── Navigate to Settings ──

- tapOn: "Settings"

- extendedWaitUntil:
    visible:
      text: "Auto Save on Exit"
    timeout: 5000

# ── Assert defaults ──

- assertVisible: "Auto Save on Exit"
- assertVisible: "Auto Load Save"

# ── Toggle "Auto Save on Exit" off ──

- tapOn: "Auto Save on Exit"

# ── Kill and relaunch the app ──

- stopApp:
    appId: "com.spela.player"
- launchApp:
    appId: "com.spela.player"

# ── Login again (state was cleared by stop) ──

- extendedWaitUntil:
    visible:
      text: "Connect to your game server"
    timeout: 15000

- tapOn: "Add Server"

- extendedWaitUntil:
    visible:
      text: "Server Name"
    timeout: 5000

- tapOn: "Server Name"
- inputText: "Local"

- tapOn: "Server URL"
- inputText: "http://192.168.11.143:8080"

- tapOn: "Add"
- tapOn: "Local"

- extendedWaitUntil:
    visible:
      text: "Welcome Back"
    timeout: 10000

- tapOn: "Username"
- inputText: "player"

- tapOn: "Password"
- inputText: "player123"

- hideKeyboard
- tapOn: "Sign In"

# ── Home screen ──

- extendedWaitUntil:
    visible:
      text: "Consoles"
    timeout: 15000

# ── Navigate to Settings and verify toggle persisted ──

- tapOn: "Settings"

- extendedWaitUntil:
    visible:
      text: "Auto Save on Exit"
    timeout: 5000

# The "Auto Save on Exit" toggle should still be off (persisted on server)
- assertVisible: "Auto Save on Exit"
