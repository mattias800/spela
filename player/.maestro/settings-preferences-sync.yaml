appId: com.spela.player
---

# Test: Settings preferences persist across app restarts
#
# Verifies that emulation preferences (auto-save, auto-load, perf overlay)
# are saved to the server and restored after app restart.

# ── Setup: login as player ──

- runFlow: setup/login-player.yaml

# ── Navigate to Settings ──

- tapOn: "Settings"

- scrollUntilVisible:
    element:
      text: "Auto Save on Exit"
    direction: DOWN
    timeout: 5000

# ── Assert defaults ──

- assertVisible: "Auto Load Save"

# ── Toggle "Auto Save on Exit" off ──

- tapOn: "Auto Save on Exit"

# ── Kill and relaunch the app ──

- stopApp:
    appId: "com.spela.player"
- launchApp:
    appId: "com.spela.player"

# ── Login again (state was cleared by stop) ──

- extendedWaitUntil:
    visible:
      text: "Connect to your game server"
    timeout: 8000

- tapOn: "Add Server"

- extendedWaitUntil:
    visible:
      text: "Server Name"
    timeout: 3000

- tapOn: "Server Name"
- inputText: "Local"

- hideKeyboard
- tapOn: "Server URL"
- inputText: "http://192.168.11.143:8080"
- hideKeyboard

- tapOn: "Add"

- extendedWaitUntil:
    visible:
      text: ".*Local.*"
    timeout: 5000

- tapOn:
    text: ".*Local.*"

- extendedWaitUntil:
    visible:
      text: "Welcome Back"
    timeout: 5000

- tapOn: "Username"
- inputText: "player"
- hideKeyboard

- tapOn: "Password"
- inputText: "player123"

- hideKeyboard
- tapOn: "Sign In"

# ── Home screen ──

- extendedWaitUntil:
    visible:
      text: "Consoles"
    timeout: 8000

# ── Navigate to Settings and verify toggle persisted ──

- tapOn: "Settings"

- scrollUntilVisible:
    element:
      text: "Auto Save on Exit"
    direction: DOWN
    timeout: 5000
