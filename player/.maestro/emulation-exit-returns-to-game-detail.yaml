appId: com.spela.player
---

# Test: Exiting a game returns to the correct game detail screen
#
# Regression test for bug where quitting a game via the overlay
# landed on the wrong screen (e.g., home screen or console list)
# instead of the game detail screen for the game that was just played.

# ── Setup: fresh start ──

- clearState:
    appId: "com.spela.player"
- launchApp:
    appId: "com.spela.player"

# ── Add server ──

- extendedWaitUntil:
    visible:
      text: "Connect to your game server"
    timeout: 15000

- tapOn: "Add Server"

- extendedWaitUntil:
    visible:
      text: "Server Name"
    timeout: 5000

- tapOn: "Server Name"
- inputText: "Local"

- tapOn: "Server URL"
- inputText: "http://192.168.11.143:8080"

- tapOn: "Add"
- tapOn: "Local"

# ── Login as player ──

- extendedWaitUntil:
    visible:
      text: "Welcome Back"
    timeout: 10000

- tapOn: "Username"
- inputText: "player"

- tapOn: "Password"
- inputText: "player123"

- hideKeyboard
- tapOn: "Sign In"

# ── Home screen ──

- extendedWaitUntil:
    visible:
      text: "Consoles"
    timeout: 15000

# ── Navigate to NES > Castlevania ──

- scrollUntilVisible:
    element:
      text: ".*Nintendo Entertainment System.*"
    direction: DOWN

- tapOn:
    text: ".*Nintendo Entertainment System.*"

- scrollUntilVisible:
    element:
      text: ".*Castlevania.*"
    direction: DOWN

- tapOn:
    text: ".*Castlevania.*"

# ── Download and play ──

- extendedWaitUntil:
    visible:
      text: "Download"
    timeout: 5000

- tapOn: "Download"

- extendedWaitUntil:
    visible:
      text: "Play"
    timeout: 15000

- tapOn: "Play"

# ── Wait for game to start (overlay no longer auto-shows) ──

- swipe:
    start: "50%,50%"
    end: "50%,50%"
    duration: 3000

# Open overlay via back button
- pressKey: "back"

- extendedWaitUntil:
    visible:
      text: "Exit Game"
    timeout: 10000

# ── Exit the game ──

- tapOn: "Exit Game"

# ── CRITICAL ASSERTIONS: Verify we landed on game detail screen ──

# 1. The game title should be visible (we're on the right game's detail page)
- extendedWaitUntil:
    visible:
      text: ".*Castlevania.*"
    timeout: 10000

# 2. The Play button should be visible (game is cached, so "Play" not "Download")
- extendedWaitUntil:
    visible:
      text: "Play"
    timeout: 5000

# 3. We should NOT be on the Home screen (Consoles section title)
# Note: "Consoles" as a section heading only appears on Home.
# The game detail screen does not have this heading.
- assertNotVisible:
    text: "Consoles"

# 4. We should NOT still be in the game (overlay elements gone)
- assertNotVisible:
    text: "Exit Game"

- assertNotVisible:
    text: "Continue"

# 5. Cover art for Castlevania should be visible (game detail screen has hero cover)
- assertVisible:
    text: ".*Castlevania.*"
