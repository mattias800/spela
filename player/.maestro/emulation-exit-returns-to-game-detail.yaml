appId: com.spela.player
---

# Test: Exiting a game returns to the correct game detail screen
#
# Regression test for bug where quitting a game via the overlay
# landed on the wrong screen (e.g., home screen or console list)
# instead of the game detail screen for the game that was just played.

# ── Setup: login as player ──

- runFlow: setup/start-logged-in.yaml

# ── Navigate to NES > Castlevania ──

- scrollUntilVisible:
    element:
      text: ".*Nintendo Entertainment System.*"
    direction: DOWN

- tapOn:
    text: ".*Nintendo Entertainment System.*"

- scrollUntilVisible:
    element:
      text: ".*Castlevania.*"
    direction: DOWN

- tapOn:
    text: ".*Castlevania.*"

# ── Download and play ──

# Download the game if not already downloaded
- runFlow:
    when:
      visible: "Download"
    file: setup/download-game.yaml

- tapOn: "Play"

# ── Wait for game to render ──

- extendedWaitUntil:
    visible:
      text: "Touch controls"
    timeout: 5000

# Open overlay via back button
- pressKey: "back"

- extendedWaitUntil:
    visible:
      text: "Exit Game"
    timeout: 5000

# ── Exit the game ──

- tapOn: "Exit Game"

# ── CRITICAL ASSERTIONS: Verify we landed on game detail screen ──

# 1. The game title should be visible (we're on the right game's detail page)
- extendedWaitUntil:
    visible:
      text: ".*Castlevania.*"
    timeout: 8000

# 2. The Play button should be visible (game is cached, so "Play" not "Download")
- extendedWaitUntil:
    visible:
      text: "Play"
    timeout: 3000

# 3. We should NOT be on the Home screen (Consoles section title)
# Note: "Consoles" as a section heading only appears on Home.
# The game detail screen does not have this heading.
- assertNotVisible:
    text: "Consoles"

# 4. We should NOT still be in the game (overlay elements gone)
- assertNotVisible:
    text: "Exit Game"

- assertNotVisible:
    text: "Continue"

# 5. Cover art for Castlevania should be visible (game detail screen has hero cover)
- assertVisible:
    text: ".*Castlevania.*"
