appId: com.spela.player
---

# Test: Fast forward toggle
#
# Verifies that the fast forward button toggles between "Fast" and "Normal"
# labels, indicating the fast forward state change.

# ── Setup: login as player ──

- runFlow: setup/login-player.yaml

# ── Navigate to NES > Castlevania ──

- scrollUntilVisible:
    element:
      text: ".*Nintendo Entertainment System.*"
    direction: DOWN

- tapOn:
    text: ".*Nintendo Entertainment System.*"

- scrollUntilVisible:
    element:
      text: ".*Castlevania.*"
    direction: DOWN

- tapOn:
    text: ".*Castlevania.*"

- extendedWaitUntil:
    visible:
      text: "About"
    timeout: 3000

- tapOn: "Download"

- extendedWaitUntil:
    visible:
      text: "Play"
    timeout: 8000

- tapOn: "Play"

# ── Wait for game to render ──

- extendedWaitUntil:
    visible:
      text: "Touch controls"
    timeout: 5000

# ── Open overlay via back button ──

- pressKey: "back"

- extendedWaitUntil:
    visible:
      text: "Exit Game"
    timeout: 5000

# ── Verify initial state shows "Fast" button ──

- assertVisible:
    text: "Fast"

# ── Tap Fast to enable fast forward ──

- tapOn: "Fast"

# ── Verify the button now shows "Normal" (fast forward is ON) ──

- extendedWaitUntil:
    visible:
      text: "Normal"
    timeout: 3000

# ── Tap Normal to disable fast forward ──

- tapOn: "Normal"

# ── Verify it reverts back to "Fast" ──

- extendedWaitUntil:
    visible:
      text: "Fast"
    timeout: 3000

# ── Exit game to clean up ──

- tapOn: "Exit Game"
