appId: com.spela.player
---

# Test: Auth session persists across app restarts
#
# After signing in, closing the app (stopApp) and relaunching it,
# the user should land on the home screen without having to log in again.
# This verifies that JWT tokens are persisted in the local SQLDelight DB
# and restored on startup.

# ── Setup: fresh start ──

- clearState:
    appId: "com.spela.player"
- launchApp:
    appId: "com.spela.player"

# ── Add server ──

- extendedWaitUntil:
    visible:
      text: "Connect to your game server"
    timeout: 15000

- tapOn: "Add Server"

- extendedWaitUntil:
    visible:
      text: "Server Name"
    timeout: 5000

- tapOn: "Server Name"
- inputText: "Local"

- tapOn: "Server URL"
- inputText: "http://192.168.11.143:8080"

- tapOn: "Add"
- tapOn: "Local"

# ── Login as player ──

- extendedWaitUntil:
    visible:
      text: "Welcome Back"
    timeout: 10000

- tapOn: "Username"
- inputText: "player"

- tapOn: "Password"
- inputText: "player123"

- hideKeyboard
- tapOn: "Sign In"

# ── Verify we reach the home screen ──

- extendedWaitUntil:
    visible:
      text: "Consoles"
    timeout: 15000

# ── Close the app (without clearing state) and relaunch ──

- stopApp:
    appId: "com.spela.player"
- launchApp:
    appId: "com.spela.player"

# ── Assert home screen appears without login ──
# If session persistence works, we should go straight to the home screen.
# If it fails, we'd see "Connect to your game server" or "Welcome Back" instead.

- extendedWaitUntil:
    visible:
      text: "Consoles"
    timeout: 15000
