appId: com.spela.player
---

# Test: NES emulation runs at acceptable frame rate (>= 30 FPS)
#
# Regression test for bug where NES emulation ran at ~1 FPS with screen
# tearing due to blocking audio callbacks starving the emulation loop.
# After the fix (ring buffer audio, double-buffered video, hw accel),
# NES games should run at 30+ FPS consistently.
#
# This test uses the FPS HUD's contentDescription ("FPS counter NN")
# to assert the frame rate is above the minimum playable threshold.
# The FPS Text composable has dedicated semantics so Maestro can find it.

# ── Setup: fresh start ──

- clearState:
    appId: "com.spela.player"
- launchApp:
    appId: "com.spela.player"

# ── Add server ──

- extendedWaitUntil:
    visible:
      text: "Connect to your game server"
    timeout: 15000

- tapOn: "Add Server"

- extendedWaitUntil:
    visible:
      text: "Server Name"
    timeout: 5000

- tapOn: "Server Name"
- inputText: "Local"

- tapOn: "Server URL"
- inputText: "http://192.168.11.143:8080"

- tapOn: "Add"
- tapOn: "Local"

# ── Login as player ──

- extendedWaitUntil:
    visible:
      text: "Welcome Back"
    timeout: 10000

- tapOn: "Username"
- inputText: "player"

- tapOn: "Password"
- inputText: "player123"

- hideKeyboard
- tapOn: "Sign In"

# ── Home screen ──

- extendedWaitUntil:
    visible:
      text: "Consoles"
    timeout: 15000

# ── Navigate to NES > Castlevania ──

- scrollUntilVisible:
    element:
      text: ".*Nintendo Entertainment System.*"
    direction: DOWN

- tapOn:
    text: ".*Nintendo Entertainment System.*"

- scrollUntilVisible:
    element:
      text: ".*Castlevania.*"
    direction: DOWN

- tapOn:
    text: ".*Castlevania.*"

- extendedWaitUntil:
    visible:
      text: "Download"
    timeout: 5000

- tapOn: "Download"

- extendedWaitUntil:
    visible:
      text: "Play"
    timeout: 15000

- tapOn: "Play"

# ── Game starts directly into gameplay (overlay no longer auto-shows) ──

# ── Wait for FPS to stabilize ──
# The emulation needs a few seconds after dismissing the overlay
# for the frame rate to settle. Use a no-op swipe as a delay.

- swipe:
    start: "50%,50%"
    end: "50%,50%"
    duration: 3000

# ── Assert FPS is above playable threshold (>= 30 FPS) ──
# The FPS Text has contentDescription = "FPS counter NN".
# Regex matches 30-99 ([3-9][0-9]) or 100+ ([1-9][0-9]{2,}).
# If FPS is below 30 (e.g., "FPS counter 1"), this will FAIL.

- extendedWaitUntil:
    visible:
      text: "FPS counter ([3-9][0-9]|[1-9][0-9]{2,})"
    timeout: 10000

# ── Take a screenshot for visual verification as well ──

- takeScreenshot: nes-fps-regression-check

# ── Reopen overlay and exit cleanly ──

- pressKey: "back"

- extendedWaitUntil:
    visible:
      text: "Exit Game"
    timeout: 5000

- tapOn: "Exit Game"

# ── Verify we return to game detail (app didn't crash) ──

- extendedWaitUntil:
    visible:
      text: "Play"
    timeout: 10000
