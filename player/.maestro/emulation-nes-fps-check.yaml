appId: com.spela.player
---

# Test: NES emulation runs at acceptable frame rate (>= 30 FPS)
#
# Regression test for bug where NES emulation ran at ~1 FPS with screen
# tearing due to blocking audio callbacks starving the emulation loop.
# After the fix (ring buffer audio, double-buffered video, hw accel),
# NES games should run at 30+ FPS consistently.
#
# This test uses the FPS HUD's contentDescription ("FPS counter NN")
# to assert the frame rate is above the minimum playable threshold.
# The FPS Text composable has dedicated semantics so Maestro can find it.

# ── Setup: login as player ──

- runFlow: setup/start-logged-in.yaml

# ── Navigate to NES > Castlevania ──

- scrollUntilVisible:
    element:
      text: ".*Nintendo Entertainment System.*"
    direction: DOWN

- tapOn:
    text: ".*Nintendo Entertainment System.*"

- scrollUntilVisible:
    element:
      text: ".*Castlevania.*"
    direction: DOWN

- tapOn:
    text: ".*Castlevania.*"

# Download the game if not already downloaded
- runFlow:
    when:
      visible: "Download"
    file: setup/download-game.yaml

- tapOn: "Play"

# ── Wait for game to render and FPS to stabilize ──

- extendedWaitUntil:
    visible:
      text: "Touch controls"
    timeout: 5000

# ── Assert FPS is above playable threshold (>= 30 FPS) ──
# The FPS Text has contentDescription = "FPS counter NN".
# Regex matches 30-99 ([3-9][0-9]) or 100+ ([1-9][0-9]{2,}).
# If FPS is below 30 (e.g., "FPS counter 1"), this will FAIL.

- extendedWaitUntil:
    visible:
      text: "FPS counter ([3-9][0-9]|[1-9][0-9]{2,})"
    timeout: 10000

# ── Take a screenshot for visual verification as well ──

- takeScreenshot: nes-fps-regression-check

# ── Reopen overlay and exit cleanly ──

- pressKey: "back"

- extendedWaitUntil:
    visible:
      text: "Exit Game"
    timeout: 5000

- tapOn: "Exit Game"

# ── Verify we return to game detail (app didn't crash) ──

- extendedWaitUntil:
    visible:
      text: "Play"
    timeout: 8000
