services:
  server:
    build:
      context: ./server
      dockerfile: Dockerfile
    ports:
      - "8080:8080"
    volumes:
      - ./testdata/roms:/app/games:ro
      - e2e-data:/app/data
      - e2e-saves:/app/saves
      - e2e-cores:/app/cores
      - e2e-images:/app/images
    environment:
      - SPELA_PORT=8080
      - SPELA_DB_PATH=/app/data/spela.db
      - SPELA_JWT_SECRET=e2e-test-secret
      - SPELA_GAME_DIRS=/app/games
      - SPELA_IMAGE_DIR=/app/images
      - SPELA_CORS_ORIGINS=http://localhost:5173
      - SPELA_SEED=true
      - SPELA_CHALLENGE_RATE_LIMIT_SEC=0
      - GIN_MODE=debug

  web:
    build:
      context: ./web
      dockerfile: Dockerfile.dev
    ports:
      - "5173:5173"
    environment:
      - VITE_API_URL=http://server:8080
    depends_on:
      - server

volumes:
  e2e-data:
  e2e-saves:
  e2e-cores:
  e2e-images:
