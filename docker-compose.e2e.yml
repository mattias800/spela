services:
  server:
    build:
      context: ./server
      dockerfile: Dockerfile
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8080/api/health"]
      interval: 5s
      timeout: 3s
      retries: 3
    ports:
      - "8080:8080"
    volumes:
      - ./testdata/roms:/app/games:ro
      # Public-domain test ROMs that ship with the repo so CI runners
      # (which don't have testdata/) can seed a non-empty library.
      # Local devs with their own testdata/ get both — PD ROMs show up
      # alongside their library. See testdata-public/ATTRIBUTION.md.
      - ./testdata-public:/app/games-public:ro
      - e2e-saves:/app/saves
      - e2e-cores:/app/cores
      - e2e-images:/app/images
    # /app/data is mounted as tmpfs — the SQLite DB lives in RAM only,
    # which makes /api/test/reset (and every test write) sub-100ms even
    # under docker-on-macOS IO contention. Contents vanish when the
    # container stops, which is what we want: every `docker compose up`
    # starts with a genuinely empty DB. 128m is plenty for the seeded
    # consoles + ~171 scanned games.
    #
    # uid/gid=1000 matches the non-root user the entrypoint drops to;
    # without these the tmpfs is root-owned and the seed step fails
    # with "directory not writable".
    tmpfs:
      - /app/data:size=128m,uid=1000,gid=1000,mode=755
    environment:
      - SPELA_PORT=8080
      - SPELA_DB_PATH=/app/data/spela.db
      - SPELA_JWT_SECRET=e2e-test-secret-that-is-at-least-32-chars-long
      - SPELA_GAME_DIRS=/app/games,/app/games-public
      - SPELA_IMAGE_DIR=/app/images
      - SPELA_CORS_ORIGINS=http://localhost:5173
      - SPELA_SEED=true
      - SPELA_CHALLENGE_RATE_LIMIT_SEC=0
      - SPELA_IGDB_CLIENT_ID=${SPELA_IGDB_CLIENT_ID:-}
      - SPELA_IGDB_CLIENT_SECRET=${SPELA_IGDB_CLIENT_SECRET:-}
      - GIN_MODE=debug
      - SPELA_TEST_MODE=true

  web:
    build:
      context: ./web
      dockerfile: Dockerfile.dev
    ports:
      - "5173:5173"
    environment:
      - VITE_API_URL=http://server:8080
    depends_on:
      - server

volumes:
  # e2e-data was the named volume for the SQLite DB — replaced by a
  # tmpfs mount on the server service for fsync-free writes.
  e2e-saves:
  e2e-cores:
  e2e-images:
