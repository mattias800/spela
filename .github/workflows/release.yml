name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to release (e.g. v0.0.58)'
        required: true

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  RELEASE_TAG: ${{ github.event.inputs.tag || github.ref_name }}

permissions:
  contents: write
  packages: write

jobs:
  # ── Tests ──────────────────────────────────────────────────────

  go-test:
    name: Go tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ env.RELEASE_TAG }}
      - uses: actions/setup-go@v5
        with:
          go-version-file: server/go.mod
          cache-dependency-path: server/go.sum
      - run: go mod download
      - run: go test ./...

  web-test:
    name: Web unit tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ env.RELEASE_TAG }}
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm run build
      - run: npm run test

  player-test:
    name: Player unit tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: player
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ env.RELEASE_TAG }}
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21
      - name: Cache Gradle
        uses: actions/cache@v5
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: player-gradle-${{ hashFiles('player/**/*.gradle*', 'player/gradle/libs.versions.toml') }}
          restore-keys: |
            player-gradle-
      - name: Run shared desktop tests
        run: ./gradlew :shared:desktopTest

  # ── Docker ─────────────────────────────────────────────────────

  docker:
    name: Docker image
    needs: [go-test, web-test]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ env.RELEASE_TAG }}
      - name: Extract version from tag
        id: meta
        run: echo "version=${RELEASE_TAG#v}" >> "$GITHUB_OUTPUT"
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          build-args: |
            SPELA_VERSION=${{ steps.meta.outputs.version }}
          tags: |
            ghcr.io/${{ github.repository }}:latest
            ghcr.io/${{ github.repository }}:${{ steps.meta.outputs.version }}

  # ── Android ────────────────────────────────────────────────────

  build-android:
    name: Android APK
    needs: [player-test]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ env.RELEASE_TAG }}
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21
      - uses: android-actions/setup-android@v3
      - name: Cache Gradle
        uses: actions/cache@v5
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: android-gradle-${{ hashFiles('player/**/*.gradle*', 'player/gradle/libs.versions.toml') }}
          restore-keys: |
            android-gradle-
      - name: Decode release keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > player/android/release.keystore
            echo "ANDROID_KEYSTORE_PATH=$(pwd)/player/android/release.keystore" >> "$GITHUB_ENV"
          fi
      - name: Build release APK
        working-directory: player
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: ./gradlew :android:assembleRelease -PappVersion=${RELEASE_TAG#v}
      - name: Upload APK
        uses: actions/upload-artifact@v5
        with:
          name: spela-android-apk
          path: player/android/build/outputs/apk/release/*.apk

  # ── Desktop (macOS, Linux x86_64, Windows) ─────────────────────

  build-desktop:
    name: Desktop (${{ matrix.os }})
    needs: [player-test]
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            format: packageDmg
            artifact-name: spela-macos-dmg
            artifact-path: player/desktop/build/compose/binaries/main/dmg/*.dmg
          - os: ubuntu-latest
            format: packageDeb
            artifact-name: spela-linux-deb
            artifact-path: player/desktop/build/compose/binaries/main/deb/*.deb
          - os: windows-latest
            format: packageMsi
            artifact-name: spela-windows-msi
            artifact-path: player/desktop/build/compose/binaries/main/msi/*.msi
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ env.RELEASE_TAG }}
      - uses: actions/setup-java@v5
        with:
          # JBR is needed on Windows/Linux for transparent title bar; macOS uses
          # native apple.awt.transparentTitleBar which works with any JDK.
          # Temurin avoids GitHub API rate limits on macOS runners.
          distribution: ${{ runner.os == 'macOS' && 'temurin' || 'jetbrains' }}
          java-version: 21
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake libvulkan-dev libx11-dev \
            libwayland-dev wayland-protocols libsdl2-dev pkg-config
      - name: Install macOS dependencies
        if: runner.os == 'macOS'
        run: |
          brew install molten-vk vulkan-headers vulkan-loader sdl2
          echo "VULKAN_SDK=$(brew --prefix)" >> "$GITHUB_ENV"
      - name: Install Windows dependencies
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $ver = "1.3.290.0"
          Invoke-WebRequest -Uri "https://sdk.lunarg.com/sdk/download/$ver/windows/VulkanSDK-$ver-Installer.exe" -OutFile vulkan_sdk.exe
          Start-Process -FilePath .\vulkan_sdk.exe -ArgumentList "--accept-licenses --default-answer --confirm-command install" -Wait
          echo "VULKAN_SDK=C:\VulkanSDK\$ver" >> $env:GITHUB_ENV
          echo "C:\VulkanSDK\$ver\Bin" >> $env:GITHUB_PATH
          choco install ninja -y
      - name: Cache Gradle
        uses: actions/cache@v5
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('player/**/*.gradle*', 'player/gradle/libs.versions.toml') }}
          restore-keys: |
            ${{ runner.os }}-gradle-
      - name: Build package
        working-directory: player
        shell: bash
        run: ./gradlew ${{ matrix.format }} -PappVersion=${RELEASE_TAG#v}
      - name: Ad-hoc codesign macOS app
        if: runner.os == 'macOS'
        shell: bash
        run: |
          # Sign the app bundle INSIDE the build output (before DMG was created).
          # JPackage builds the .app first, then wraps it in a DMG. We sign the
          # .app in-place and rebuild the DMG to preserve all contents (runtime, etc).
          APP_DIR=$(ls -d player/desktop/build/compose/binaries/main/app/*.app 2>/dev/null | head -1)
          if [ -z "$APP_DIR" ]; then
            echo "No .app found in build output, skipping codesign"
            exit 0
          fi
          echo "Signing $APP_DIR"
          # Ad-hoc sign all Mach-O binaries (JRE libs, native libs, launcher)
          find "$APP_DIR" -type f \( -name '*.dylib' -o -name '*.jnilib' \) -print0 | while IFS= read -r -d '' f; do
            codesign --force --sign - "$f" 2>/dev/null || true
          done
          find "$APP_DIR" -type f -perm +111 -print0 | while IFS= read -r -d '' f; do
            if file "$f" | grep -q 'Mach-O'; then
              codesign --force --sign - "$f" 2>/dev/null || true
            fi
          done
          # Sign the app bundle itself
          codesign --force --deep --sign - "$APP_DIR"
          echo "Signed $APP_DIR"
          # Rebuild DMG with the signed app
          DMG_PATH=$(ls player/desktop/build/compose/binaries/main/dmg/*.dmg)
          rm "$DMG_PATH"
          hdiutil create -volname "Spela" -srcfolder "$APP_DIR" -ov -format UDZO "$DMG_PATH"
          echo "Repackaged $DMG_PATH"
      - name: Upload artifact
        uses: actions/upload-artifact@v5
        with:
          name: ${{ matrix.artifact-name }}
          path: ${{ matrix.artifact-path }}

  # ── Linux AppImage (x86_64) ────────────────────────────────────

  build-appimage:
    name: Linux AppImage (x86_64)
    needs: [player-test]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ env.RELEASE_TAG }}
      - uses: actions/setup-java@v5
        with:
          distribution: jetbrains
          java-version: 21
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake libvulkan-dev libx11-dev \
            libwayland-dev wayland-protocols libsdl2-dev pkg-config libfuse2
      - name: Cache Gradle
        uses: actions/cache@v5
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: Linux-gradle-${{ hashFiles('player/**/*.gradle*', 'player/gradle/libs.versions.toml') }}
          restore-keys: |
            Linux-gradle-
      - name: Build distributable
        working-directory: player
        run: ./gradlew createDistributable -PappVersion=${RELEASE_TAG#v}
      - name: Build AppImage
        working-directory: player
        run: bash linux/build-appimage.sh --arch x86_64
      - name: Upload AppImage
        uses: actions/upload-artifact@v5
        with:
          name: spela-linux-appimage-x86_64
          path: player/desktop/build/appimage/Spela-x86_64.AppImage

  # ── Linux Flatpak ──────────────────────────────────────────────

  build-flatpak:
    name: Linux Flatpak
    needs: [player-test]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ env.RELEASE_TAG }}
      - uses: actions/setup-java@v5
        with:
          distribution: jetbrains
          java-version: 21
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake libvulkan-dev libx11-dev \
            libwayland-dev wayland-protocols libsdl2-dev pkg-config \
            flatpak flatpak-builder
      - name: Set up Flatpak
        run: |
          sudo flatpak remote-add --if-not-exists flathub https://dl.flathub.org/repo/flathub.flatpakrepo
          sudo flatpak install -y --noninteractive flathub \
            org.freedesktop.Platform//24.08 \
            org.freedesktop.Sdk//24.08 \
            org.freedesktop.Sdk.Extension.openjdk21//24.08
      - name: Cache Gradle
        uses: actions/cache@v5
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: Linux-gradle-${{ hashFiles('player/**/*.gradle*', 'player/gradle/libs.versions.toml') }}
          restore-keys: |
            Linux-gradle-
      - name: Build distributable
        working-directory: player
        run: ./gradlew createDistributable -PappVersion=${RELEASE_TAG#v}
      - name: Build Flatpak
        working-directory: player
        run: bash linux/flatpak/build-flatpak.sh
      - name: Upload Flatpak
        uses: actions/upload-artifact@v5
        with:
          name: spela-linux-flatpak
          path: player/desktop/build/flatpak/spela.flatpak

  # ── Linux ARM64 ────────────────────────────────────────────────

  build-linux-arm64:
    name: Linux ARM64
    needs: [player-test]
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ env.RELEASE_TAG }}
      - uses: actions/setup-java@v5
        with:
          distribution: jetbrains
          java-version: 21
          token: ${{ secrets.GITHUB_TOKEN }}
      - uses: android-actions/setup-android@v3
        with:
          packages: ''
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake libvulkan-dev libx11-dev \
            libwayland-dev wayland-protocols libsdl2-dev pkg-config libfuse2
      - name: Cache Gradle
        uses: actions/cache@v5
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: Linux-ARM64-gradle-${{ hashFiles('player/**/*.gradle*', 'player/gradle/libs.versions.toml') }}
          restore-keys: |
            Linux-ARM64-gradle-
      - name: Build distributable
        working-directory: player
        run: ./gradlew createDistributable -PappVersion=${RELEASE_TAG#v}
      - name: Build DEB
        working-directory: player
        run: ./gradlew packageDeb -PappVersion=${RELEASE_TAG#v}
      - name: Build AppImage
        working-directory: player
        run: bash linux/build-appimage.sh --arch aarch64
      - name: Upload DEB
        uses: actions/upload-artifact@v5
        with:
          name: spela-linux-arm64-deb
          path: player/desktop/build/compose/binaries/main/deb/*.deb
      - name: Upload AppImage
        uses: actions/upload-artifact@v5
        with:
          name: spela-linux-appimage-aarch64
          path: player/desktop/build/appimage/Spela-aarch64.AppImage

  # ── GitHub Release ─────────────────────────────────────────────

  create-release:
    name: Create GitHub Release
    needs:
      - docker
      - build-android
      - build-desktop
      - build-appimage
      - build-flatpak
      - build-linux-arm64
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ env.RELEASE_TAG }}
      - name: Download all artifacts
        uses: actions/download-artifact@v5
        with:
          path: artifacts
          pattern: spela-*
          merge-multiple: true
      - name: Collect release files
        run: |
          VERSION="${RELEASE_TAG#v}"
          mkdir -p release
          find artifacts -type f \( \
            -name "*.apk" -o -name "*.dmg" -o -name "*.deb" \
            -o -name "*.msi" -o -name "*.AppImage" -o -name "*.flatpak" \
          \) -exec cp {} release/ \;
          cd release
          # Rename APK (no version in build output filename)
          [ -f android-release.apk ] && mv android-release.apk "spela-${VERSION}-android.apk"
          [ -f app-release.apk ] && mv app-release.apk "spela-${VERSION}-android.apk"
          # Rename AppImage/Flatpak (no version in build output filename)
          for f in Spela-x86_64.AppImage Spela-aarch64.AppImage; do
            [ -f "$f" ] && mv "$f" "${f/Spela-/Spela-${VERSION}-}"
          done
          [ -f spela.flatpak ] && mv spela.flatpak "spela-${VERSION}.flatpak"
          # Fix DMG/MSI/DEB filenames: packaging bumps 0.x.y → 1.x.y for macOS
          # compatibility, so replace the bumped version with the real tag version
          if [[ "$VERSION" == 0.* ]]; then
            PKG_VERSION="1${VERSION#0}"
            for f in *; do
              new="${f//$PKG_VERSION/$VERSION}"
              [ "$f" != "$new" ] && mv "$f" "$new"
            done
          fi
          echo "Release artifacts:"
          ls -lh .
      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          generate_release_notes: true
          files: release/*
