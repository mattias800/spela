name: Android Build

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    name: Build Android APK

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Cache Gradle
        uses: actions/cache@v5
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: android-gradle-${{ hashFiles('player/**/*.gradle*', 'player/gradle/libs.versions.toml') }}
          restore-keys: |
            android-gradle-

      - name: Run unit tests
        working-directory: player
        run: ./gradlew :shared:testDebugUnitTest :android:testDebugUnitTest

      - name: Build debug APK
        working-directory: player
        run: ./gradlew :android:assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v5
        with:
          name: spela-android-apk
          path: player/android/build/outputs/apk/debug/*.apk
