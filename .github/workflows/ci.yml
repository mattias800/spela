name: CI

on:
  push:
    branches: [master]
    paths-ignore:
      - '**.md'
      - 'LICENSE'
      - '.plans/**'
      - 'design-proposals/**'
  pull_request:
    branches: [master]
    paths-ignore:
      - '**.md'
      - 'LICENSE'
      - '.plans/**'
      - 'design-proposals/**'

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

# Cancel superseded runs for the same PR or branch. A newer PR commit or master
# push contains the state we need to validate, so keeping stale CI fan-out alive
# only burns runners and can slow the current gate.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  go-test-api:
    name: Go tests API (${{ matrix.shard }}/8)
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4, 5, 6, 7, 8]
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version-file: server/go.mod
          cache-dependency-path: server/go.sum
      - run: go mod download
      - name: Run API test shard
        env:
          SHARD: ${{ matrix.shard }}
          TOTAL: 8
        run: |
          mapfile -t tests < <(
            go test -list '^Test' ./internal/api |
              awk -v shard="$SHARD" -v total="$TOTAL" '
                /^Test/ && ((++n - 1) % total) == (shard - 1) { print }
              '
          )

          if [ "${#tests[@]}" -eq 0 ]; then
            echo "::error::no API tests selected for shard $SHARD/$TOTAL"
            exit 1
          fi

          printf 'API shard %s/%s selected %s tests\n' "$SHARD" "$TOTAL" "${#tests[@]}"
          regex=$(printf '%s\n' "${tests[@]}" | paste -sd'|' -)
          go test ./internal/api -run "^(${regex})$"

  go-test-rest:
    name: Go tests non-API packages
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version-file: server/go.mod
          cache-dependency-path: server/go.sum
      - run: go mod download
      - name: Run non-API Go tests
        run: |
          mapfile -t packages < <(go list ./... | grep -vx 'github.com/spela/server/internal/api')
          go test "${packages[@]}"

  go-test:
    name: Go tests
    runs-on: ubuntu-latest
    needs: [go-test-api, go-test-rest]
    if: ${{ always() }}
    steps:
      - name: Require all Go test jobs
        run: |
          echo "API shards: ${{ needs.go-test-api.result }}"
          echo "Non-API packages: ${{ needs.go-test-rest.result }}"
          test "${{ needs.go-test-api.result }}" = "success"
          test "${{ needs.go-test-rest.result }}" = "success"

  web-test:
    name: Web unit tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm run build
      - run: npm run test

  player-test:
    name: Player unit tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: player
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21
      - name: Cache Gradle
        uses: actions/cache@v5
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: player-gradle-${{ hashFiles('player/**/*.gradle*', 'player/gradle.properties', 'player/gradle/libs.versions.toml') }}
          restore-keys: |
            player-gradle-
      # The Gradle steps below are desktop-only, but Gradle configures the
      # :android module too, and AGP resolves the pinned NDK at configuration
      # time. Pre-install it (and the cmake the native build pins) explicitly
      # with retries so AGP never triggers its own un-retried, flake-prone
      # on-the-fly install — which broke the v0.0.251 release run. ubuntu-latest
      # ships the SDK; setup-android just ensures sdkmanager is on PATH. (#1281)
      - uses: android-actions/setup-android@v4
        with:
          packages: ''
      - name: Pre-install pinned Android NDK + cmake
        run: |
          for i in 1 2 3; do
            yes | sdkmanager --install "ndk;27.0.12077973" "cmake;3.22.1" && exit 0
            echo "::warning::sdkmanager install attempt $i failed; retrying in 15s" >&2
            sleep 15
          done
          echo "::error::NDK/cmake install failed after 3 attempts" >&2
          exit 1
      - name: Run shared desktop tests
        run: ./gradlew :shared:desktopTest
      - name: Run detekt rules unit tests
        run: ./gradlew :detekt-rules:test
      - name: Run detekt (design-system rules + style:UnusedImport, type resolution)
        run: ./gradlew :shared:detektMainDesktop :android:detektDebugAndroid :desktop:detektMainDesktop

  docker:
    name: Build & push Docker image
    needs: [go-test, web-test]
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v6
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          tags: |
            ghcr.io/${{ github.repository }}:latest
            ghcr.io/${{ github.repository }}:${{ github.sha }}
