name: CI

on:
  push:
    branches: [master]
    paths-ignore:
      - '**.md'
      - 'LICENSE'
      - '.plans/**'
      - 'design-proposals/**'
  pull_request:
    branches: [master]
    paths-ignore:
      - '**.md'
      - 'LICENSE'
      - '.plans/**'
      - 'design-proposals/**'

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  go-test:
    name: Go tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version-file: server/go.mod
          cache-dependency-path: server/go.sum
      - run: go mod download
      - run: go test ./...

  web-test:
    name: Web unit tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm run build
      - run: npm run test

  player-test:
    name: Player unit tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: player
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21
      - name: Cache Gradle
        uses: actions/cache@v5
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: player-gradle-${{ hashFiles('player/**/*.gradle*', 'player/gradle/libs.versions.toml') }}
          restore-keys: |
            player-gradle-
      # The Gradle steps below are desktop-only, but Gradle configures the
      # :android module too, and AGP resolves the pinned NDK at configuration
      # time. Pre-install it (and the cmake the native build pins) explicitly
      # with retries so AGP never triggers its own un-retried, flake-prone
      # on-the-fly install — which broke the v0.0.251 release run. ubuntu-latest
      # ships the SDK; setup-android just ensures sdkmanager is on PATH. (#1281)
      - uses: android-actions/setup-android@v4
        with:
          packages: ''
      - name: Pre-install pinned Android NDK + cmake
        run: |
          for i in 1 2 3; do
            yes | sdkmanager --install "ndk;27.0.12077973" "cmake;3.22.1" && exit 0
            echo "::warning::sdkmanager install attempt $i failed; retrying in 15s" >&2
            sleep 15
          done
          echo "::error::NDK/cmake install failed after 3 attempts" >&2
          exit 1
      - name: Run shared desktop tests
        run: ./gradlew :shared:desktopTest
      - name: Run detekt rules unit tests
        run: ./gradlew :detekt-rules:test
      - name: Run detekt (design-system rules + style:UnusedImport, type resolution)
        run: ./gradlew :shared:detektMainDesktop :android:detektDebugAndroid :desktop:detektMainDesktop

  docker:
    name: Build & push Docker image
    needs: [go-test, web-test]
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v6
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          tags: |
            ghcr.io/${{ github.repository }}:latest
            ghcr.io/${{ github.repository }}:${{ github.sha }}
