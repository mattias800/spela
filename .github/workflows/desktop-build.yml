name: Desktop Build (macOS, Linux, Windows)

on:
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            format: packageDmg
            artifact-name: spela-macos-dmg
            artifact-path: player/desktop/build/compose/binaries/main/dmg/*.dmg
          - os: ubuntu-latest
            format: packageDeb
            artifact-name: spela-linux-deb
            artifact-path: player/desktop/build/compose/binaries/main/deb/*.deb
          - os: windows-latest
            format: packageMsi
            artifact-name: spela-windows-msi
            artifact-path: player/desktop/build/compose/binaries/main/msi/*.msi

    runs-on: ${{ matrix.os }}
    name: Build (${{ matrix.os }})

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          # Match release.yml: bundle JBR on Windows/Linux — its AWT patches
          # (fractional HiDPI on Linux, transparent title bar) are required;
          # stock Temurin mis-scales on Linux Wayland/HiDPI. macOS AWT needs
          # no patches and Temurin avoids GitHub API rate limits there.
          distribution: ${{ runner.os == 'macOS' && 'temurin' || 'jetbrains' }}
          java-version: 21
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake libvulkan-dev libx11-dev \
            libwayland-dev wayland-protocols pkg-config

      - name: Install macOS dependencies
        if: runner.os == 'macOS'
        run: |
          brew install molten-vk vulkan-headers vulkan-loader
          echo "VULKAN_SDK=$(brew --prefix)" >> "$GITHUB_ENV"

      - name: Install Vulkan SDK (Windows)
        if: runner.os == 'Windows'
        uses: humbletim/setup-vulkan-sdk@v1.2.1
        with:
          vulkan-query-version: 1.3.290.0
          vulkan-components: Vulkan-Headers, Vulkan-Loader
          vulkan-use-cache: true

      - name: Cache Gradle
        uses: actions/cache@v5
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('player/**/*.gradle*', 'player/gradle.properties', 'player/gradle/libs.versions.toml') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: Run unit tests
        working-directory: player
        # Only the fast shared suite here (matches ci.yml). The full
        # :desktop:desktopTest E2E suite exceeds this job's 15m timeout and
        # is not a packaging gate; CI-ifying it is tracked separately.
        run: ./gradlew :shared:desktopTest

      - name: Build native library and package
        working-directory: player
        run: ./gradlew ${{ matrix.format }}

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.artifact-name }}
          path: ${{ matrix.artifact-path }}

  build-appimage:
    runs-on: ubuntu-latest
    name: Build AppImage (x86_64)
    needs: []

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          # JBR to match release.yml — see the matrix job's comment.
          distribution: jetbrains
          java-version: 21
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Install Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake libvulkan-dev libx11-dev \
            libwayland-dev wayland-protocols pkg-config \
            libfuse2

      - name: Cache Gradle
        uses: actions/cache@v5
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: Linux-gradle-${{ hashFiles('player/**/*.gradle*', 'player/gradle.properties', 'player/gradle/libs.versions.toml') }}
          restore-keys: |
            Linux-gradle-

      - name: Build distributable
        working-directory: player
        run: ./gradlew createDistributable

      - name: Build AppImage
        working-directory: player
        run: bash linux/build-appimage.sh --arch x86_64

      - name: Upload AppImage
        uses: actions/upload-artifact@v7
        with:
          name: spela-linux-appimage-x86_64
          path: player/desktop/build/appimage/Spela-x86_64.AppImage

  build-flatpak:
    runs-on: ubuntu-latest
    name: Build Flatpak
    needs: []

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          # JBR to match release.yml — see the matrix job's comment.
          distribution: jetbrains
          java-version: 21
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Install Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake libvulkan-dev libx11-dev \
            libwayland-dev wayland-protocols pkg-config \
            flatpak flatpak-builder

      - name: Set up Flatpak
        run: |
          sudo flatpak remote-add --if-not-exists flathub https://dl.flathub.org/repo/flathub.flatpakrepo
          sudo flatpak install -y --noninteractive flathub \
            org.freedesktop.Platform//24.08 \
            org.freedesktop.Sdk//24.08 \
            org.freedesktop.Sdk.Extension.openjdk21//24.08

      - name: Cache Gradle
        uses: actions/cache@v5
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: Linux-gradle-${{ hashFiles('player/**/*.gradle*', 'player/gradle.properties', 'player/gradle/libs.versions.toml') }}
          restore-keys: |
            Linux-gradle-

      - name: Build distributable
        working-directory: player
        run: ./gradlew createDistributable

      - name: Build Flatpak
        working-directory: player
        run: bash linux/flatpak/build-flatpak.sh

      - name: Upload Flatpak
        uses: actions/upload-artifact@v7
        with:
          name: spela-linux-flatpak
          path: player/desktop/build/flatpak/spela.flatpak

  build-linux-arm64:
    runs-on: ubuntu-24.04-arm
    name: Build Linux ARM64
    needs: []

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          # JBR to match release.yml — see the matrix job's comment.
          distribution: jetbrains
          java-version: 21
          token: ${{ secrets.GITHUB_TOKEN }}

      # Gradle configures the :android module unconditionally, so even this
      # desktop-only build needs the Android SDK location. ubuntu-latest /
      # macOS / windows runners ship it; the ARM64 runner does not — provision
      # it here. packages:'' skips the deprecated `tools` package (whose
      # install fails on the ARM64 runner); we only need ANDROID_HOME +
      # cmdline-tools so :android can configure. (#1277)
      - uses: android-actions/setup-android@v4
        with:
          packages: ''

      - name: Install Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake libvulkan-dev libx11-dev \
            libwayland-dev wayland-protocols pkg-config \
            libfuse2

      - name: Cache Gradle
        uses: actions/cache@v5
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: Linux-ARM64-gradle-${{ hashFiles('player/**/*.gradle*', 'player/gradle.properties', 'player/gradle/libs.versions.toml') }}
          restore-keys: |
            Linux-ARM64-gradle-

      - name: Run unit tests
        working-directory: player
        # Only the fast shared suite here (matches ci.yml). The full
        # :desktop:desktopTest E2E suite exceeds this job's 15m timeout and
        # is not a packaging gate; CI-ifying it is tracked separately.
        run: ./gradlew :shared:desktopTest

      - name: Build distributable and DEB
        working-directory: player
        run: ./gradlew createDistributable packageDeb

      - name: Build AppImage
        working-directory: player
        run: bash linux/build-appimage.sh --arch aarch64

      - name: Upload DEB
        uses: actions/upload-artifact@v7
        with:
          name: spela-linux-arm64-deb
          path: player/desktop/build/compose/binaries/main/deb/*.deb

      - name: Upload AppImage
        uses: actions/upload-artifact@v7
        with:
          name: spela-linux-appimage-aarch64
          path: player/desktop/build/appimage/Spela-aarch64.AppImage
