name: Desktop Build (macOS, Linux, Windows)

on:
  push:
    branches: [release]
  workflow_dispatch:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            format: packageDmg
            artifact-name: spela-macos-dmg
            artifact-path: player/desktop/build/compose/binaries/main/dmg/*.dmg
          - os: ubuntu-latest
            format: packageDeb
            artifact-name: spela-linux-deb
            artifact-path: player/desktop/build/compose/binaries/main/deb/*.deb
          - os: windows-latest
            format: packageMsi
            artifact-name: spela-windows-msi
            artifact-path: player/desktop/build/compose/binaries/main/msi/*.msi

    runs-on: ${{ matrix.os }}
    name: Build (${{ matrix.os }})

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake libvulkan-dev libx11-dev

      - name: Install Vulkan SDK (Windows)
        if: runner.os == 'Windows'
        uses: humbletim/setup-vulkan-sdk@v1.2.0
        with:
          vulkan-query-version: 1.3.290.0
          vulkan-components: Vulkan-Headers, Vulkan-Loader
          vulkan-use-cache: true

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('player/**/*.gradle*', 'player/gradle/libs.versions.toml') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: Run unit tests
        working-directory: player
        run: ./gradlew :shared:desktopTest :desktop:desktopTest

      - name: Build native library and package
        working-directory: player
        run: ./gradlew ${{ matrix.format }}

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact-name }}
          path: ${{ matrix.artifact-path }}
