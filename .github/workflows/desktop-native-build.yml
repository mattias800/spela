name: Desktop Native Build

on:
  push:
    branches: [master]
    paths:
      - 'player/native/**'
      - 'player/desktop/**'
      - 'player/gradle/libs.versions.toml'
      - 'player/gradle.properties'
      - 'player/settings.gradle.kts'
      - 'player/build.gradle.kts'
      - '.github/workflows/desktop-native-build.yml'
  pull_request:
    branches: [master]
    paths:
      - 'player/native/**'
      - 'player/desktop/**'
      - 'player/gradle/libs.versions.toml'
      - 'player/gradle.properties'
      - 'player/settings.gradle.kts'
      - 'player/build.gradle.kts'
      - '.github/workflows/desktop-native-build.yml'

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  linux-native:
    name: Linux desktop native library
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: player
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21

      - name: Install Linux native dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake libvulkan-dev libx11-dev \
            libwayland-dev wayland-protocols libsdl2-dev pkg-config

      - uses: android-actions/setup-android@v4
        with:
          packages: ''

      - name: Pre-install pinned Android NDK + cmake
        run: |
          for i in 1 2 3; do
            yes | sdkmanager --install "ndk;27.0.12077973" "cmake;3.22.1" && exit 0
            echo "::warning::sdkmanager install attempt $i failed; retrying in 15s" >&2
            sleep 15
          done
          echo "::error::NDK/cmake install failed after 3 attempts" >&2
          exit 1

      - name: Cache Gradle
        uses: actions/cache@v5
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: desktop-native-gradle-${{ hashFiles('player/**/*.gradle*', 'player/gradle.properties', 'player/gradle/libs.versions.toml') }}
          restore-keys: |
            desktop-native-gradle-

      - name: Build desktop native library
        run: ./gradlew :desktop:buildNativeLibrary
